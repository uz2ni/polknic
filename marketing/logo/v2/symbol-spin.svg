<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 스핀 폴: 링 뒤쪽 반 → 폴 → 링 앞쪽 반 순서로 그려 폴을 감싸 도는 것처럼 -->
  <defs><clipPath id="front"><rect x="0" y="60" width="100" height="40"/></clipPath></defs>
  <rect width="100" height="100" rx="24" fill="#fffaee"/>
  <g transform="rotate(-12 50 60)"><ellipse cx="50" cy="60" rx="30" ry="9" fill="none" stroke="#f0789a" stroke-width="5" opacity=".55"/></g>
  <rect x="44" y="34" width="12" height="54" rx="6" fill="#5a4237"/>
  <circle cx="50" cy="22" r="10.5" fill="#f0789a"/>
  <g transform="rotate(-12 50 60)"><ellipse cx="50" cy="60" rx="30" ry="9" fill="none" stroke="#f0789a" stroke-width="5" clip-path="url(#front)"/></g>
</svg>
