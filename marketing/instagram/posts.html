<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>폴크닉 인스타 게시물</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* 미리보기: 축소해서 가로로 나란히. export.js는 ?export로 열어 원래 크기로 캡처 */
body{margin:0;background:#2f2a28;display:flex;flex-wrap:wrap;gap:40px;padding:40px;align-items:flex-start}
body:not(.export){zoom:.4}
.ab::before{content:attr(id);position:absolute;z-index:9;top:-1px;right:0;font:700 28px var(--f-b);color:#fff;background:rgba(0,0,0,.5);padding:4px 14px}
body.export .ab::before{display:none}

/* 01 첫인사 */
#p01-hello .bg{transform:scale(1.05);transform-origin:40% 40%}
#p01-hello .head{position:absolute;top:150px;left:0;right:0;text-align:center}
#p01-hello .title{font-size:150px}
#p01-hello .foot{position:absolute;left:var(--pad);right:var(--pad);bottom:64px;display:flex;align-items:center;gap:28px;padding:30px 36px}
#p01-hello .foot .t{font-family:var(--f-d);font-size:58px;line-height:1;display:flex;align-items:flex-end;gap:14px}
#p01-hello .foot .t .word{height:64px;display:block}
#p01-hello .foot .t small{font-size:34px;color:var(--pink)}
#p01-hello .foot .d{font-size:30px;font-weight:700;color:var(--ink-soft);margin-top:10px}
#p01-hello .btn{margin-left:auto}

/* 02 기술 도감 표지 */
#p02-moves{background:var(--sky);display:flex;flex-direction:column;gap:56px;padding:150px var(--pad) 0;box-sizing:border-box}
#p02-moves .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.7) 4px,transparent 5px);background-size:44px 44px}
#p02-moves .head{position:relative;padding:0 8px}
#p02-moves .title{font-size:118px}
#p02-moves .lead{font-size:36px;font-weight:600;margin-top:22px}
#p02-moves .grid{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:24px}
#p02-moves .card{grid-column:span 2;background:#fff;border-radius:40px;padding:12px;box-shadow:0 8px 0 rgba(90,66,55,.12)}
#p02-moves .card:nth-child(4){grid-column:2/span 2}
#p02-moves .ph{height:240px;border-radius:30px;overflow:hidden;background:#bfe6c5}
#p02-moves .ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transform-origin:var(--o,50% 50%)}
#p02-moves .lab{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 6px}
#p02-moves .lab b{font-family:var(--f-d);font-weight:400;font-size:44px}
#p02-moves .lab i{font-style:normal;font-family:var(--f-d);font-size:26px;color:#fff;background:var(--sky-d);border-radius:999px;padding:6px 16px}
#p02-moves .foot{position:relative;flex:1;margin-top:-56px;display:flex;align-items:center;justify-content:center}   /* 카드 아래 남은 공간의 정가운데 */

/* 03 폴메이트 */
#p03-mate .bg{transform:scale(1.1);transform-origin:50% 55%}
#p03-mate .head{position:absolute;top:150px;right:var(--pad);text-align:right}
#p03-mate .title{font-size:128px}
#p03-mate .stat{position:absolute;right:var(--pad);top:470px;display:flex;flex-direction:column;align-items:flex-end;gap:16px}
#p03-mate .card{position:absolute;left:var(--pad);right:var(--pad);bottom:64px;padding:30px 36px;display:flex;align-items:center;gap:26px}
#p03-mate .av{width:96px;height:96px;border-radius:50%;background:var(--butter);display:grid;place-items:center;font-family:var(--f-d);font-size:48px;flex:none}
#p03-mate .card .t{font-family:var(--f-d);font-size:46px;line-height:1.15}
#p03-mate .card .d{font-size:28px;font-weight:600;color:var(--ink-soft);margin-top:6px}
#p03-mate .btn{margin-left:auto}
</style>
</head>
<body>
<script>if (location.search.includes('export')) document.body.classList.add('export');</script>

<!-- 새 게시물은 <section class="ab" id="pNN-이름">을 추가. id가 그대로 out/ 파일 이름이 됨. 배경 렌더는 shots.json -->

<section class="ab" id="p01-hello">
  <img class="bg" src="renders/hello-ppose.png">
  <span class="series news">폴크닉 오픈</span>
  <div class="head"><h1 class="title on-photo">폴 타러<br>피크닉 갈래?</h1></div>
  <div class="bubble" style="left:150px;top:560px">같이 타자!</div>
  <div class="foot panel">
    <div><div class="t"><img class="word" src="../logo/v2/wordmark.svg" alt="폴크닉"> <small>온라인 폴댄스 놀이터</small></div><div class="d">polknic.yujamong.com</div></div>
    <div class="btn pink">입장하기</div>
  </div>
</section>

<section class="ab" id="p02-moves">
  <div class="dots"></div>
  <span class="series move">폴 기술 도감</span>
  <div class="head">
    <h1 class="title">귀엽게 따라 하는<br>폴댄스 기술</h1>
    <div class="lead">어려운 동작도 가뿐히 성공!</div>
  </div>
  <div class="grid">
    <div class="card"><div class="ph"><img src="renders/tile-chair.png"></div><div class="lab"><b>체어</b><i>01</i></div></div>
    <div class="card"><div class="ph"><img src="renders/tile-hera.png"></div><div class="lab"><b>헤라</b><i>02</i></div></div>
    <div class="card"><div class="ph"><img src="renders/tile-brass.png" style="--o:50% 100%"></div><div class="lab"><b>브라스</b><i>03</i></div></div>
    <div class="card"><div class="ph"><img src="renders/tile-ppose.png"></div><div class="lab"><b>P포즈</b><i>04</i></div></div>
    <div class="card"><div class="ph"><img src="renders/tile-split.png"></div><div class="lab"><b>스플릿</b><i>05</i></div></div>
  </div>
  <div class="foot"><span class="chip">옆으로 넘겨서 하나씩 보기 →</span></div>
</section>

<section class="ab" id="p03-mate">
  <img class="bg" src="renders/duo-fly.png">
  <span class="series mate">폴메이트</span>
  <div class="head"><h1 class="title on-photo">둘이 타면<br>회전목마가 돼요</h1></div>
  <div class="stat">
    <span class="chip">폴메이트와 함께하는 더블폴</span>
    <span class="chip">채팅으로 수다 떨기</span>
  </div>
  <div class="card panel">
    <div class="av">유</div>
    <div><div class="t">자몽님이 같이 타재요!</div><div class="d">캐릭터를 누르면 같이 타기 신청</div></div>
    <div class="btn butter">수락</div>
  </div>
</section>

</body>
</html>
