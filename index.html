<style>
/* Layout: full-bleed 3D lakeside scene; soft cream panels dock to the edges (wardrobe right, move bar bottom). Single light look, matches the pastel daylight scene. */
:root{
  --ink:#5a4237;
  --muted:#9a8172;
  --glass:rgba(255,250,238,.9);
  --line:rgba(90,66,55,.14);
  --accent:#f0789a;
  --sky:#c6ebf8;
  --f-display:"Jua","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene canvas:active{cursor:grabbing}

.brand{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;pointer-events:none;color:#fff;text-shadow:0 2px 0 rgba(90,66,55,.35),0 3px 18px rgba(40,110,150,.3)}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.8vw,46px);letter-spacing:.08em;margin:0;text-wrap:balance;display:inline-flex;align-items:center;gap:.3em}
.brand h1 img{width:1.05em;height:1.05em;border-radius:.25em;box-shadow:0 2px 0 rgba(90,66,55,.25)}
.brand p{margin:.4em 0 0;font-size:12.5px;font-weight:600;letter-spacing:.12em}
.brand .now{margin-top:.5em;font-size:12px;letter-spacing:.04em;font-weight:600}

.glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:2px solid #fff;box-shadow:0 4px 0 rgba(90,66,55,.12),0 12px 28px rgba(60,110,130,.16);border-radius:22px}

/* side panels (wardrobe, settings) open under the corner icons */
#wardrobe,#settings{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:284px;max-width:calc(100% - 32px);max-height:calc(100% - 230px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px;z-index:5;box-sizing:border-box}
.set-row{display:flex;flex-wrap:wrap;gap:6px}
#settings .hint{color:var(--muted);text-shadow:none;text-align:left;line-height:1.6}
#settings .copy{color:var(--muted);text-shadow:none;margin:0}
.w-head{display:flex;align-items:center;justify-content:space-between}
.w-head h2{font-family:var(--f-display);font-size:21px;font-weight:400;margin:0;letter-spacing:.04em}
.w-sec{display:flex;flex-direction:column;gap:8px}
.w-sec h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);font:500 13px/1 var(--f-body);padding:8px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid #fff;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.swatch[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.textbtn{border:0;background:none;color:var(--muted);font:500 13px var(--f-body);cursor:pointer;padding:6px 4px}
/* top-right corner: round icon buttons (full view, hide menus, wardrobe, settings) */
.corner{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:6;display:flex;gap:8px}
.iconbtn{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:50%;color:var(--ink);cursor:pointer;flex:0 0 auto}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-pressed="true"],.iconbtn[aria-expanded="true"]{background:var(--accent);color:#fff}
.corner .gap{width:4px}

.hud{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:3}
.hud > *{pointer-events:auto}
.talk{position:relative;display:flex;align-items:center;gap:8px;width:min(470px,100%);justify-content:center}
.tog{border:2px solid #fff;border-radius:999px;font:600 12.5px var(--f-body);padding:6px 12px;cursor:pointer;background:var(--glass);color:var(--ink);text-shadow:none}
.tog[aria-pressed="true"]{background:var(--accent);color:#fff}
.moves{display:flex;gap:4px;padding:5px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.moves::-webkit-scrollbar{display:none}
.move{flex:0 0 auto;border:0;background:transparent;font:400 15px var(--f-display);color:var(--ink);padding:10px 14px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px}
.move[aria-pressed="true"]{background:var(--accent);color:#fff}
.move.leave{color:#d4567b}
.moves .sep{flex:0 0 1.5px;margin:8px 2px;background:var(--line);border-radius:1px}
.move:disabled{opacity:.45;cursor:default}
.move[hidden],.moves .sep[hidden]{display:none}
.copy{margin:-4px 0 0;font-size:11px;color:rgba(255,255,255,.85);text-shadow:0 1px 0 rgba(90,66,55,.4),0 1px 6px rgba(40,90,50,.5);letter-spacing:.04em}
.hint{font-size:12px;color:#fff;text-shadow:0 1px 0 rgba(90,66,55,.4),0 1px 8px rgba(40,90,50,.55);margin:0;text-align:center}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.faces{position:absolute;bottom:calc(100% + 8px);left:0;display:flex;align-items:center;gap:2px;padding:4px 6px}
.faces span{font:600 11px var(--f-body);color:var(--muted);letter-spacing:.08em;padding:0 6px 0 4px}
.face{border:0;background:transparent;font:400 13.5px var(--f-display);color:var(--ink);padding:6px 10px;border-radius:999px;cursor:pointer}
.face[aria-pressed="true"]{background:var(--accent);color:#fff}
/* chat: one input row in the HUD, speech bubbles over heads */
.chat{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 12px;flex:1;min-width:0;box-sizing:border-box}
.chat input{flex:1;min-width:0;border:0;background:transparent;font:500 14px var(--f-body);color:var(--ink);outline:none;padding:6px 0}
.chat input::placeholder{color:var(--muted)}
.chat button{border:0;border-radius:999px;background:var(--accent);color:#fff;font:400 14px var(--f-display);padding:7px 14px;cursor:pointer}
.bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;z-index:2;max-width:180px;padding:6px 11px;border-radius:14px;background:#fff;color:var(--ink);font:500 13px/1.35 var(--f-body);word-break:break-all;box-shadow:0 2px 0 rgba(90,66,55,.12);transition:opacity .3s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble.fade{opacity:0}
.bubble b{display:block;font:600 11px/1.3 var(--f-body);color:var(--accent);margin-bottom:1px}
.bubble b:empty{display:none}
body.clean .bubble{display:none}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:8;padding:8px 14px;border-radius:999px;background:rgba(90,66,55,.82);color:#fff;font:500 13px var(--f-body);pointer-events:none;white-space:nowrap}

/* photo mode: menus hidden for clean screenshots / screen recordings; one small button fades in on movement */
body.clean .brand,body.clean #wardrobe,body.clean #settings,body.clean .corner,body.clean .hud{display:none!important}
#uiShow{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:6;width:30px;height:30px;padding:0;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.8);border-radius:50%;background:rgba(255,250,238,.55);color:var(--ink);cursor:pointer;transition:opacity .4s}
#uiShow svg{width:14px;height:14px}
#uiShow.idle{opacity:0}
/* name tags are bare text with a soft outline, so they don't read as speech bubbles */
#nameTag,.nameTag{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;z-index:2;font:700 12.5px var(--f-body);color:#fff;padding:3px 4px;white-space:nowrap;text-shadow:0 0 2px rgba(90,66,55,.9),0 0 2px rgba(90,66,55,.9),0 1px 3px rgba(90,66,55,.6)}

#entry{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(198,235,248,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#entry form{width:min(340px,100%);padding:26px 24px 22px;display:flex;flex-direction:column;gap:12px;text-align:center}
#entry h2{font-family:var(--f-display);font-weight:400;font-size:34px;margin:-4px 0 0;color:var(--ink)}
#entry .logo{width:64px;height:64px;margin:0 auto -2px;border-radius:16px;box-shadow:0 3px 0 rgba(90,66,55,.12)}
#entry .eyebrow{font:600 12px var(--f-body);letter-spacing:.14em;color:var(--accent)}
#entry p{margin:0;color:var(--muted);font-size:13.5px}
#entry input,.name-row input{font:500 16px var(--f-body);color:var(--ink);padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;outline:none;min-width:0}
#entry input:focus,.name-row input:focus{border-color:var(--accent)}
#entry .err{color:#d4567b;font-size:12.5px;min-height:1em}
/* room picker (entry screen and settings): five lakesides with how many are in each */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.room{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:7px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font:400 14px var(--f-display)}
.room small{font:500 11px var(--f-body);color:var(--muted)}
.room[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.room[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.room:disabled{opacity:.45;cursor:default}
#entry .rooms-label{font:600 11px var(--f-body);letter-spacing:.14em;color:var(--muted);text-align:left;margin-bottom:-4px}
.go{border:0;border-radius:999px;background:var(--accent);color:#fff;font:400 18px var(--f-display);padding:12px;cursor:pointer;box-shadow:0 3px 0 #c95a7c}
.name-row{display:flex;gap:6px}
.name-row input{flex:1;font-size:14px;padding:8px 12px}
.name-row .chip{flex:0 0 auto}
@media (max-width:640px){
  .brand{top:calc(16px + env(safe-area-inset-top,0px));text-align:left;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .brand h1{letter-spacing:.06em;font-size:26px}
  .brand p{letter-spacing:.06em}
  .corner{gap:6px}
  .iconbtn{width:38px;height:38px}
  .moves{gap:0;padding:5px 3px;flex-wrap:wrap;justify-content:center}
  .move{padding:9px 7px;min-width:0;font-size:14px}
}
</style>

</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const T = THREE;
const V3 = T.Vector3, Q = T.Quaternion;
const col = h => new T.Color(h).convertSRGBToLinear();
const PI = Math.PI;

/* ---------- renderer / scene ---------- */
const host = document.getElementById('scene');
const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new T.Scene();
const FOG = 0xd9f0f6;
scene.fog = new T.Fog(col(FOG), 70, 340);
const camera = new T.PerspectiveCamera(45, 1, 0.05, 1200);

/* ---------- helpers ---------- */
let seed = 11;
function rnd(){ seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function hash(x, z){ const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z){ const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi; const u = xf*xf*(3-2*xf), v = zf*zf*(3-2*zf); const a = hash(xi,zi), b = hash(xi+1,zi), c = hash(xi,zi+1), d = hash(xi+1,zi+1); return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v; }

/* ---------- toon shading (shared by scenery and character) ---------- */
const grad = (() => {
  const d = new Uint8Array([165, 205, 238, 255]);
  const t = new T.DataTexture(d, 4, 1, T.LuminanceFormat);
  t.minFilter = t.magFilter = T.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
  return t;
})();
const TOON_K = 0.37; // toon colors are pre-darkened so full sunlight lands near the swatch color
const tcol = h => col(h).multiplyScalar(TOON_K);
const toon = (h, o = {}) => new T.MeshToonMaterial(Object.assign({ color:tcol(h), gradientMap:grad, side:T.DoubleSide, toneMapped:false }, o));
const toonF = (h, o = {}) => toon(h, Object.assign({ side:T.FrontSide }, o));
function canvasTex(size, draw, repeat){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 4;
  if (repeat){ t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(repeat, repeat); }
  return t;
}

/* ---------- sky ---------- */
const skyGeo = new T.SphereGeometry(600, 32, 16);
const skyMat = new T.ShaderMaterial({
  uniforms: { top:{value:new T.Color(0x3d9fea)}, mid:{value:new T.Color(0x86cdf5)}, low:{value:new T.Color(0xe6f7fb)}, ground:{value:new T.Color(0x8fcf6e)} },
  vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }',
  fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 low; uniform vec3 ground; varying vec3 vW; void main(){ float h = normalize(vW - cameraPosition).y; vec3 c = mix(low, mid, smoothstep(0.0,0.2,h)); c = mix(c, top, smoothstep(0.2,0.9,h)); c = mix(c, ground, smoothstep(0.0,-0.12,h)); gl_FragColor = vec4(c,1.0); }',
  side: T.BackSide, depthWrite: false, fog: false
});
const sky = new T.Mesh(skyGeo, skyMat); sky.renderOrder = -1; scene.add(sky);
const pmrem = new T.PMREMGenerator(renderer);
const envScene = new T.Scene(); envScene.add(new T.Mesh(skyGeo, skyMat));
scene.environment = pmrem.fromScene(envScene, 0.03).texture;

/* ---------- lights ---------- */
scene.add(new T.HemisphereLight(col(0xdff0ff), col(0x7cae55), 0.55));
const sun = new T.DirectionalLight(col(0xfff4e2), 2.3);
sun.position.set(12, 20, 13);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-11, right:11, top:11, bottom:-11, near:1, far:60 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun); scene.add(sun.target);

/* ---------- lake ---------- */
const LAKE = { x:0, z:-21, rx:38, rz:13 };
const lakeR = a => 1 + 0.06*Math.sin(a*5.0) + 0.04*Math.sin(a*11 + 1.3);
function inLake(x, z, m = 0){ const dx = x - LAKE.x, dz = z - LAKE.z; const a = Math.atan2(dz / LAKE.rz, dx / LAKE.rx); const f = lakeR(a); return (dx*dx)/((LAKE.rx*f+m)**2) + (dz*dz)/((LAKE.rz*f+m)**2) < 1; }
function lakeShape(m){
  const shape = new T.Shape();
  for (let i = 0; i <= 160; i++){
    const a = i/160*PI*2, f = lakeR(a);
    const x = LAKE.x + Math.cos(a)*(LAKE.rx*f + m), z = LAKE.z + Math.sin(a)*(LAKE.rz*f + m);
    i ? shape.lineTo(x, -z) : shape.moveTo(x, -z);
  }
  const g = new T.ShapeGeometry(shape, 64); g.rotateX(-PI/2);
  return g;
}

/* ---------- ground: bright lawn with little grass ticks ---------- */
{
  const g = new T.PlaneGeometry(700, 700, 160, 160); g.rotateX(-PI/2);
  const pos = g.attributes.position, cols = [];
  const a = col(0x5fae3e), b = col(0x77c04a), c = col(0x4f9e38), tmp = new T.Color();
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const n = vnoise(x*0.08, z*0.08)*0.6 + vnoise(x*0.3, z*0.3)*0.4;
    tmp.copy(a).lerp(b, n); tmp.lerp(c, Math.max(0, vnoise(x*0.03+9, z*0.03)-0.55)*1.6);
    cols.push(tmp.r, tmp.g, tmp.b);
  }
  g.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
  const ticks = canvasTex(256, (x, s) => {
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, s, s);
    for (let i = 0; i < 26; i++){
      const px = rnd()*s, py = rnd()*s, w = 5 + rnd()*4;
      x.fillStyle = rnd() < 0.7 ? 'rgba(60,130,40,.28)' : 'rgba(255,255,220,.45)';
      x.beginPath(); x.moveTo(px - w, py - w*0.6); x.lineTo(px, py + w*0.7); x.lineTo(px + w, py - w*0.6); x.lineTo(px, py); x.closePath(); x.fill();
    }
  }, 160);
  const ground = new T.Mesh(g, new T.MeshLambertMaterial({ vertexColors:true, map:ticks }));
  ground.receiveShadow = true; scene.add(ground);
}
const waterUniforms = {
  t:{value:0}, deep:{value:new T.Color(0x2fa3c4)}, shallow:{value:new T.Color(0x76d6db)},
  skyC:{value:new T.Color(0x9fdcf6)}, horizon:{value:new T.Color(0xe8f8fb)}, treeC:{value:new T.Color(0x4f9f5c)},
  fogC:{value:new T.Color(FOG)}, sunDir:{value:new V3(12,20,13).normalize()}
};
{
  // sandy bank, then a white foam line, then the water on top
  const sand = new T.Mesh(lakeShape(2.2), toonF('#f3dfa8', { depthWrite:false, polygonOffset:true, polygonOffsetFactor:-1, polygonOffsetUnits:-1 }));
  sand.position.y = 0.012; sand.renderOrder = 1; scene.add(sand);
  const foam = new T.Mesh(lakeShape(0.45), toonF('#ffffff', { depthWrite:false, polygonOffset:true, polygonOffsetFactor:-1, polygonOffsetUnits:-1 }));
  foam.position.y = 0.022; foam.renderOrder = 2; scene.add(foam);
  const mat = new T.ShaderMaterial({
    uniforms: waterUniforms, fog:false,
    vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }',
    fragmentShader: `
      uniform float t; uniform vec3 deep; uniform vec3 shallow; uniform vec3 skyC; uniform vec3 horizon; uniform vec3 treeC; uniform vec3 fogC; uniform vec3 sunDir;
      varying vec3 vW;
      void main(){
        vec2 p = vW.xz;
        vec3 n = normalize(vec3(
          0.035*cos(p.x*0.9+t*0.8) + 0.025*cos((p.x+p.y)*2.7+t*1.7),
          1.0,
          0.04*cos(p.y*1.3-t*0.6) + 0.025*cos((p.x+p.y)*2.7+t*1.7)));
        vec3 v = normalize(cameraPosition - vW);
        float fres = pow(1.0 - max(dot(n, v), 0.0), 3.0);
        vec3 r = reflect(-v, n);
        vec3 refl = mix(horizon, skyC, smoothstep(0.0, 0.45, r.y));
        refl = mix(refl, treeC, smoothstep(-24.0, -32.0, p.y) * 0.6);
        vec3 c = mix(mix(shallow, deep, 0.55), refl, 0.25 + 0.5*fres);
        // soft cartoon sparkles
        float sp = smoothstep(0.93, 0.97, sin(p.x*3.1 + t*1.3) * sin(p.y*4.3 - t*0.9));
        c = mix(c, vec3(1.0), sp*0.55);
        float spec = pow(max(dot(r, sunDir), 0.0), 120.0);
        c += vec3(1.0, 0.98, 0.92) * spec * 0.6;
        float d = length(vW - cameraPosition);
        c = mix(c, fogC, smoothstep(70.0, 340.0, d));
        gl_FragColor = vec4(c, 1.0);
      }`
  });
  const water = new T.Mesh(lakeShape(0), mat); water.position.y = 0.04; water.renderOrder = 3; scene.add(water);
}
/* reeds */
{
  const geo = new T.ConeGeometry(0.03, 1, 5); geo.translate(0, 0.5, 0);
  const reeds = new T.InstancedMesh(geo, toonF('#ffffff'), 500);
  const m = new T.Matrix4(), q = new Q(), s = new V3(), p = new V3(), e = new T.Euler(), c = new T.Color();
  let n = 0;
  while (n < 500){
    const a = rnd()*PI*2, f = lakeR(a), k = 1.0 + (rnd()*0.06 - 0.01);
    const x = LAKE.x + Math.cos(a)*LAKE.rx*f*k, z = LAKE.z + Math.sin(a)*LAKE.rz*f*k;
    if (Math.sin(a) < 0.1 && rnd() < 0.6) continue;
    if (vnoise(x*0.25, z*0.25) < 0.5) continue;
    p.set(x, 0, z); e.set((rnd()-0.5)*0.3, rnd()*6, (rnd()-0.5)*0.3); q.setFromEuler(e);
    s.set(1, 0.4 + rnd()*0.6, 1);
    reeds.setMatrixAt(n, m.compose(p, q, s));
    reeds.setColorAt(n, c.setRGB(1, 1, 1).lerp(new T.Color(0.75, 0.85, 0.6), rnd()));
    n++;
  }
  reeds.material.color = tcol('#5fae48');
  scene.add(reeds);
}
/* flowers */
{
  const m = new T.Matrix4(), q = new Q(), s = new V3(), p = new V3(), c = new T.Color();

  // little round flowers in clusters, each on a short stem
  const FC = 360;
  const heads = new T.InstancedMesh(new T.SphereGeometry(0.05, 10, 6), toonF('#ffffff'), FC);
  const centers = new T.InstancedMesh(new T.SphereGeometry(0.022, 8, 5), toonF('#ffd84a'), FC);
  const stemGeo = new T.CylinderGeometry(0.008, 0.008, 1, 4); stemGeo.translate(0, 0.5, 0);
  const stems = new T.InstancedMesh(stemGeo, toonF('#4f9f3c'), FC);
  const PETALS = ['#ff9fb8', '#fff6f0', '#ffd34f', '#c9a4f2', '#ff8a7a', '#9fd3ff'];
  let fn = 0;
  while (fn < FC){
    const r = 2.2 + rnd()*13, a = rnd()*PI*2;
    const cx = Math.cos(a)*r, cz = Math.sin(a)*r + 1;
    if (inLake(cx, cz, 2.8) || Math.hypot(cx, cz - 1) > 15) continue;
    const hex = PETALS[Math.floor(rnd()*PETALS.length)], k = 4 + Math.floor(rnd()*6);
    for (let i = 0; i < k && fn < FC; i++){
      const x = cx + (rnd()-0.5)*0.9, z = cz + (rnd()-0.5)*0.9, h = 0.1 + rnd()*0.08;
      stems.setMatrixAt(fn, m.compose(p.set(x, 0, z), q.identity(), s.set(1, h, 1)));
      heads.setMatrixAt(fn, m.compose(p.set(x, h + 0.02, z), q.identity(), s.set(1, 0.55, 1)));
      centers.setMatrixAt(fn, m.compose(p.set(x, h + 0.045, z), q.identity(), s.set(1, 0.6, 1)));
      heads.setColorAt(fn, col(hex));
      fn++;
    }
  }
  scene.add(stems, heads, centers);
}
/* trees: puffy round ones and stacked-cone pines */
const trunkGeo = new T.CylinderGeometry(0.17, 0.26, 1, 9); trunkGeo.translate(0, 0.5, 0);
const puffGeo = new T.SphereGeometry(1, 22, 16);
const pineGeo = new T.ConeGeometry(1, 1.2, 12); pineGeo.translate(0, 0.6, 0);
const trunkMat = toonF('#a8784e');
const leafMats = ['#4fb04a', '#5fc056', '#6fcc5e', '#46a24a'].map(h => toonF(h));
const pineMats = ['#3e9a5c', '#4aaa68'].map(h => toonF(h));
function tree(x, z, s, shadow){
  const g = new T.Group();
  const trunk = new T.Mesh(trunkGeo, trunkMat); g.add(trunk);
  if (rnd() < 0.7){
    trunk.scale.set(s, 1.7*s, s);
    const mat = leafMats[Math.floor(rnd()*leafMats.length)];
    const main = new T.Mesh(puffGeo, mat); main.scale.set(1.45*s, 1.3*s, 1.45*s); main.position.y = 2.6*s; g.add(main);
    const puffs = 2 + Math.floor(rnd()*3);
    for (let i = 0; i < puffs; i++){
      const a = rnd()*PI*2, r = (0.6 + rnd()*0.3)*s;
      const l = new T.Mesh(puffGeo, mat); l.scale.setScalar(r);
      l.position.set(Math.cos(a)*1.1*s, (2.2 + rnd()*0.9)*s, Math.sin(a)*1.1*s); g.add(l);
    }
  } else {
    trunk.scale.set(0.8*s, 1.2*s, 0.8*s);
    const mat = pineMats[Math.floor(rnd()*pineMats.length)];
    [[1.25, 0.9], [1.0, 1.9], [0.72, 2.8]].forEach(([r, y]) => {
      const l = new T.Mesh(pineGeo, mat); l.scale.set(r*s, 1.3*s, r*s); l.position.y = y*s; g.add(l);
    });
  }
  g.position.set(x, 0, z); g.rotation.y = rnd()*6;
  g.traverse(o => { if (o.isMesh){ o.castShadow = shadow; o.receiveShadow = false; } });
  scene.add(g);
}
for (let i = 0; i < 46; i++){
  const side = i % 2 ? 1 : -1;
  const x = side*(10 + rnd()*20), z = -7 + rnd()*24;
  if (inLake(x, z, 3)) continue;
  tree(x, z, 0.9 + rnd()*0.6, Math.hypot(x, z) < 18);
}
for (let i = 0; i < 24; i++){ tree((rnd()-0.5)*70, 18 + rnd()*25, 0.9 + rnd()*0.6, false); }
for (let i = 0; i < 130; i++){
  const x = (rnd()-0.5)*150, z = -36 - rnd()*22;
  if (inLake(x, z, 3)) continue;
  tree(x, z, 1.1 + rnd()*0.9, false);
}
/* round bushes around the clearing */
{
  const mats = ['#3f9e48', '#4cae50'].map(h => toonF(h));
  for (let i = 0; i < 26; i++){
    const a = rnd()*PI*2, r = 9 + rnd()*6;
    const x = Math.cos(a)*r, z = Math.sin(a)*r + 1;
    if (inLake(x, z, 3)) continue;
    const g = new T.Group(), mat = mats[i % 2];
    for (let k = 0; k < 3; k++){
      const b = new T.Mesh(puffGeo, mat); const sc = 0.35 + rnd()*0.25;
      b.scale.set(sc*1.1, sc*0.85, sc); b.position.set((k - 1)*0.42, sc*0.55, (rnd()-0.5)*0.3);
      b.castShadow = Math.hypot(x, z) < 14; g.add(b);
    }
    g.position.set(x, 0, z); g.rotation.y = rnd()*6; scene.add(g);
  }
}
/* soft rolling hills */
{
  const hillMat = toonF('#79c565');
  [[-60,-78,40,9],[10,-85,46,12],[75,-80,38,10],[-120,-70,34,8]].forEach(([x,z,r,h]) => {
    const m = new T.Mesh(new T.SphereGeometry(1, 32, 14, 0, PI*2, 0, PI/2), hillMat);
    m.scale.set(r, h, r*0.55); m.position.set(x, -0.2, z); scene.add(m);
  });
  const farMat = toonF('#93cdb0');
  [[-130,-175,95,50],[-25,-205,120,62],[95,-185,95,46],[185,-150,75,36],[-210,-140,70,32]].forEach(([x,z,r,h]) => {
    const m = new T.Mesh(new T.SphereGeometry(1, 32, 14, 0, PI*2, 0, PI/2), farMat);
    m.scale.set(r, h, r*0.6); m.position.set(x, -2, z); scene.add(m);
  });
}
/* clouds */
const clouds = [];
{
  const cgeo = new T.SphereGeometry(1, 18, 12);
  const cmat = new T.MeshStandardMaterial({ color:0xffffff, emissive:col(0xe4edf5), emissiveIntensity:0.7, roughness:1, fog:false });
  for (let i = 0; i < 14; i++){
    const g = new T.Group();
    const puffs = 5 + Math.floor(rnd()*4), w = 10 + rnd()*12;
    for (let k = 0; k < puffs; k++){
      const p = new T.Mesh(cgeo, cmat);
      const r = (0.45 + rnd()*0.4)*w*0.45;
      p.scale.set(r*1.15, r*0.9, r);
      p.position.set((k/(puffs - 1) - 0.5)*w*1.3, rnd()*w*0.15, (rnd()-0.5)*w*0.3);
      g.add(p);
    }
    g.position.set((rnd()-0.5)*360, 45 + rnd()*45, -110 - rnd()*170);
    g.userData.v = 0.4 + rnd()*0.8;
    scene.add(g); clouds.push(g);
  }
}
/* stage (round wooden deck) + pole */
const POLE = new V3(0, 0, 0);
const POLE_H = 3.0, STAGE_H = 0.06;
{
  const planks = canvasTex(512, (x, s) => {
    x.fillStyle = '#e6bd88'; x.fillRect(0, 0, s, s);
    const w = s/12;
    for (let i = 0; i < 12; i++){
      x.fillStyle = i % 2 ? 'rgba(255,240,215,.18)' : 'rgba(150,90,40,.06)'; x.fillRect(i*w, 0, w, s);
      x.fillStyle = 'rgba(120,70,30,.35)'; x.fillRect(i*w, 0, 3, s);
      const cut = rnd()*s; x.fillRect(i*w, cut, w, 3);
    }
  });
  const deck = new T.Mesh(new T.CylinderGeometry(1.35, 1.4, STAGE_H, 64), [toonF('#c48d58'), toonF('#ffffff', { map:planks }), toonF('#c48d58')]);
  deck.position.y = STAGE_H/2; deck.receiveShadow = true; deck.castShadow = true; scene.add(deck);
  const rim = new T.Mesh(new T.TorusGeometry(1.375, 0.03, 10, 96), toonF('#f6a9bd'));
  rim.rotation.x = PI/2; rim.position.y = STAGE_H; scene.add(rim);
  // bright brushed silver: full chrome only mirrors the env map and reads almost black from most angles
  const chrome = new T.MeshStandardMaterial({ color:col(0xe8ebef), metalness:0.55, roughness:0.28, envMapIntensity:1.4 });
  const pole = new T.Mesh(new T.CylinderGeometry(0.0225, 0.0225, POLE_H, 36), chrome);
  pole.position.y = STAGE_H + POLE_H/2; pole.castShadow = true; scene.add(pole);
  const base = new T.Mesh(new T.CylinderGeometry(0.055, 0.075, 0.06, 32), chrome);
  base.position.y = STAGE_H + 0.03; scene.add(base);
  const cap = new T.Mesh(new T.SphereGeometry(0.045, 16, 10), toonF('#f6a9bd'));
  cap.position.y = STAGE_H + POLE_H; scene.add(cap);
}
/* props: stepping stones, benches, a sign, low fences, rocks by the water, butterflies */
const OBSTACLES = [];   // [x, z, r] circles the character walks around
const BENCHES = [];     // { x, z, rot, mesh } — seats she can walk to and sit on
{
  const stoneM = toonF('#ddd5c4'), woodM = toonF('#c99462'), woodD = toonF('#a8784e'), rockM = toonF('#b9b8b0');
  const stoneGeo = new T.CylinderGeometry(1, 1.06, 1, 18);
  for (let i = 0; i < 8; i++){
    const t = i/7, x = 0.5 + Math.sin(t*2.4)*0.7 + (rnd()-0.5)*0.15, z = 2.1 + t*5.6;
    const st = new T.Mesh(stoneGeo, stoneM); const r = 0.26 + rnd()*0.08;
    st.scale.set(r, 0.035, r*(0.8 + rnd()*0.2)); st.position.set(x, 0.0175, z); st.rotation.y = rnd()*3;
    st.receiveShadow = true; scene.add(st);
  }
  function bench(x, z){
    const g = new T.Group();
    const box = (w, h, d, px, py, pz, m) => { const b = new T.Mesh(new T.BoxGeometry(w, h, d), m); b.position.set(px, py, pz); b.castShadow = true; g.add(b); };

function lathe(profile, mat, sx = 1, sz = 1, off = 0, seg = 32){

function sub(profile, y0, y1){
  const lerpR = y => { for (let i = 0; i < profile.length - 1; i++){ const [r0, a] = profile[i], [r1, b] = profile[i+1]; if (y >= a && y <= b) return r0 + (r1 - r0)*(y - a)/(b - a); } return y < profile[0][1] ? profile[0][0] : profile[profile.length-1][0]; };
  const out = [[lerpR(y0), y0]];
  profile.forEach(([r, y]) => { if (y > y0 && y < y1) out.push([r, y]); });

function strandGeo(len, w, thick){

    p.setZ(i, p.getZ(i) + t*t*w*0.9);                        // curl toward the tip
  }

// a sphere cap whose lower edge follows bottom(phi): the scalloped hair shell.
// phi follows three's sphere convention (PI/2 = front/+Z, 3PI/2 = back).
function shellGeo(r, bottom, bump, segU = 96, segV = 22){
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= segU; i++){
    const phi = i/segU*PI*2, tb = bottom(phi);
    for (let j = 0; j <= segV; j++){
      const th = j/segV*tb, rr = r*(1 + bump(phi)*Math.min(1, th/0.7));
      pos.push(-rr*Math.cos(phi)*Math.sin(th), rr*Math.cos(th), rr*Math.sin(phi)*Math.sin(th));
      uv.push(i/segU, j/segV);
    }
  }
  for (let i = 0; i < segU; i++) for (let j = 0; j < segV; j++){
    const a = i*(segV + 1) + j, b = a + segV + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

  const char = new T.Group(); holder.add(char);
  const J = {}, P = {};
  function joint(name, parent, x, y, z){ const g = new T.Group(); g.position.set(x, y, z); parent.add(g); J[name] = g; return g; }
  function piece(key, obj, parent){ parent.add(obj); (P[key] = P[key] || []).push(obj); return obj; }

  /* --- body: a short, round torso --- */
  char.add(lathe(PELVIS, skinM, 1, 0.86));
  char.add(at(ell(0.03, 1.2, 0.5, 1, skinM), 0, -0.075, 0));
  piece('brief', lathe(sub(PELVIS, -0.078, 0.0), botM, 1, 0.86, 0.004), char);
  piece('brief', at(ell(0.032, 1.2, 0.5, 1, botM), 0, -0.075, 0), char);
  piece('briefHi', lathe(sub(PELVIS, 0.0, 0.05), botM, 1, 0.86, 0.004), char);
  piece('leoBot', lathe(PELVIS, topM, 1, 0.86, 0.003), char);
  piece('leoBot', at(ell(0.032, 1.2, 0.5, 1, topM), 0, -0.075, 0), char);

  const spine = joint('spine', char, 0, 0.03, 0);
  spine.add(lathe(ABD, skinM, 1, 0.86));
  spine.add(at(ell(0.005, 1, 1.4, 1, navelM), 0, 0.03, 0.077)); // navel
  piece('leoMid', lathe(ABD, topM, 1, 0.86, 0.004), spine);
  piece('briefHi', lathe(sub(ABD, -0.01, 0.03), botM, 1, 0.86, 0.004), spine);

  const chest = joint('chest', spine, 0, 0.08, 0);
  chest.add(lathe(CHEST, skinM, 1, 0.84));
  piece('topFull', lathe(sub(CHEST, -0.01, 0.13), topM, 1, 0.84, 0.004), chest);
  piece('topSport', lathe(sub(CHEST, 0.0, 0.09), topM, 1, 0.84, 0.004), chest);
  piece('topBand', lathe(sub(CHEST, 0.02, 0.065), topM, 1, 0.84, 0.004), chest);
  // straps
  [-1, 1].forEach(s => {
    piece('halterStrap', tube([[s*0.045,0.06,0.083],[s*0.04,0.11,0.06],[s*0.03,0.15,0.015],[s*0.01,0.16,-0.03],[0,0.155,-0.045]], 0.006, topM), chest);
    piece('sportStrap', tube([[s*0.055,0.085,0.075],[s*0.068,0.135,0.03],[s*0.066,0.135,-0.03],[s*0.04,0.09,-0.078],[-s*0.02,0.05,-0.085]], 0.008, topM), chest);
    piece('fullStrap', tube([[s*0.06,0.1,0.065],[s*0.075,0.135,0.0],[s*0.06,0.1,-0.065]], 0.014, topM), chest);
  });

  /* --- neck & head --- */
  const neck = joint('neck', chest, 0, 0.14, 0);
  neck.add(lathe([[0.042,-0.02],[0.038,0.045]], skinM, 1, 0.95));
  const head = joint('head', neck, 0, 0.03, 0);
  const skull = new T.Group(); skull.position.y = HEAD_Y; skull.scale.set(1.06, 0.97, 1); head.add(skull);
  skull.add(mesh(chinify(new T.SphereGeometry(HEAD_R, 48, 36), HEAD_R), skinM));
  [-1, 1].forEach(s => skull.add(at(ell(0.032, 0.55, 1, 0.8, skinM), s*0.212, -0.02, -0.01))); // ears

  const faceCanvases = {}, faceTex = {};
  EXPRS.forEach(n => {
    const c = faceCanvases[n] = document.createElement('canvas'); c.width = FACE_W*faceRes; c.height = FACE_H*faceRes;
    const t = faceTex[n] = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 4;
  });
  const faceM = new T.MeshToonMaterial({ map:faceTex.open, color:new T.Color(TOON_K,TOON_K,TOON_K), gradientMap:grad, toneMapped:false, transparent:true, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-2 });
  const faceMesh = mesh(chinify(new T.SphereGeometry(HEAD_R*1.004, 48, 32, PI/2 - FACE_PHI/2, FACE_PHI, FACE_TH0, FACE_THL), HEAD_R*1.004), faceM);
  faceMesh.castShadow = false;
  skull.add(faceMesh);

  // hair: one scalloped shell — short chunky fringe in front, a bob around the sides and back
  const hairShell = mesh(shellGeo(HEAD_R*1.07,
    phi => {
      const d = frontBack(phi);
      const fringe = 1.2 + 0.11*Math.pow(Math.abs(Math.cos((phi - PI/2)*5.5)), 0.6);
      const bob = 2.08 + 0.1*Math.pow(Math.abs(Math.cos(phi*7)), 0.6);
      return fringe + (bob - fringe)*smooth(0.72, 1.45, d);
    },
    phi => 0.012*(1 + Math.cos(phi*6))), hairM);
  skull.add(hairShell);
  // crown shine
  skull.add(at(ell(HEAD_R*1.1, 1, 1, 1, shineM, 0.45, 0.14, 0, PI*2), 0, 0, 0));

  // long hair: one smooth curtain around the back, gently flared, with a scalloped hem
  const longPivot = joint('long', head, 0, 0.2, -0.02);
  {
    const len = 0.4, g = new T.CylinderGeometry(0.235, 0.27, len, 48, 8, true, PI*0.5 - 0.15, PI + 0.3);
    g.translate(0, -len/2, 0);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++){
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i), t = -y/len, a = Math.atan2(x, z);
      p.setY(i, y - t*0.03*(1 + Math.cos(a*9)));               // scallops at the tips
      p.setZ(i, z*(1 - 0.25*t*t) - 0.02*t);                    // tuck in toward the shoulders
    }
    g.computeVertexNormals();
    longPivot.add(mesh(g, hairM));
  }
  piece('long', longPivot, head);
  // high ponytail
  const tailPivot = joint('tail', head, 0, 0.38, -0.2);
  tailPivot.add(at(ell(0.05, 1.1, 1, 1, hairM), 0, 0, 0));
  tailPivot.add(at(mesh(new T.TorusGeometry(0.04, 0.012, 8, 20), accM), 0, 0, 0.012));
  [[0, 0.32, 0.085], [-0.35, 0.27, 0.065], [0.35, 0.28, 0.065]].forEach(([a, len, w]) => {
    const pv = new T.Group(); pv.rotation.y = PI + a; tailPivot.add(pv);
    const s = mesh(strandGeo(len, w, 0.7), hairM); s.position.set(0, -0.01, 0.03); s.rotation.x = -0.55; pv.add(s);
  });
  piece('tail', tailPivot, head);
  // round bun at the back with a ribbon
  const bunG = new T.Group();
  bunG.add(at(ell(0.09, 1.05, 1, 0.95, hairM), 0, 0.1, -0.215));
  const tie = mesh(new T.TorusGeometry(0.075, 0.016, 8, 24), accM);
  tie.position.set(0, 0.1, -0.165); tie.rotation.set(0.2, 0, 0); bunG.add(tie);
  piece('bun', bunG, skull);

  /* --- arms: short and round, mitten hands --- */
  [['l', 1], ['r', -1]].forEach(([s, x]) => {
    const up = joint(s + 'Up', chest, x*0.1, 0.11, 0);
    up.add(at(ell(0.038, 1, 1, 1, skinM), 0, 0, 0));
    up.add(lathe(UPPER, skinM));
    up.add(at(ell(0.029, 1, 1, 1, skinM), 0, -0.13, 0));
    piece('sleeve', at(ell(0.058, 1, 0.82, 1, topM), 0, -0.025, 0), up);
    const fore = joint(s + 'Fore', up, 0, -0.13, 0);
    fore.add(lathe(FORE, skinM));
    const hand = joint(s + 'Hand', fore, 0, -0.12, 0);
    hand.add(at(ell(0.042, 0.95, 1.05, 0.85, skinM), 0, -0.03, 0));
    hand.add(at(ell(0.016, 1, 1.2, 1, skinM), x*0.0, -0.022, 0.03)); // thumb nub
  });

  /* --- legs: stubby, round feet --- */
  [['l', 1], ['r', -1]].forEach(([s, x]) => {
    const th = joint(s + 'Thigh', char, x*0.052, -0.035, 0);
    th.add(at(ell(0.05, 1, 1, 1, skinM), 0, 0, 0));
    th.add(lathe(THIGH, skinM));
    th.add(at(ell(0.04, 1, 1, 1, skinM), 0, -0.14, 0));
    piece('hiShortLeg', lathe([[0.056,-0.05],[0.056,0.0]], botM), th);
    const sh = joint(s + 'Shin', th, 0, -0.14, 0);
    sh.add(lathe(SHIN, skinM));
    const ft = joint(s + 'Foot', sh, 0, -0.135, 0);
    ft.add(at(ell(0.036, 1, 1, 1, skinM), 0, -0.008, 0));
    ft.add(at(ell(1, 0.042, 0.033, 0.068, skinM), 0, -0.024, 0.022));
    piece('heel' + s, at(ell(1, 0.048, 0.04, 0.076, shoeM), 0, -0.022, 0.022), ft);
    piece('heel' + s, at(mesh(new T.CylinderGeometry(0.014, 0.01, 0.04, 10), shoeM), 0, -0.05, -0.035), ft);
  });

  // lace crop & leotard: a bow at the neckline
  piece('topBow', at(bow(0.42), 0, 0.118, 0.083), chest);
  piece('acc-ribbon', onHair(bow(1), [0.55, 0.78, 0.3]), skull);
  {
    const g = new T.Group();
    for (let i = 0; i < 5; i++){ const a = i/5*PI*2; const pt = at(ell(0.03, 1, 1, 0.4, accW), Math.cos(a)*0.032, Math.sin(a)*0.032, 0); g.add(pt); }
    g.add(at(ell(0.02, 1, 1, 0.6, accY), 0, 0, 0.008));
    piece('acc-flower', onHair(g, [0.6, 0.72, 0.36]), skull);
  }
  {
    const shape = new T.Shape();
    for (let i = 0; i <= 10; i++){ const a = i/10*PI*2 + PI/2, r = i % 2 ? 0.022 : 0.05; i ? shape.lineTo(Math.cos(a)*r, Math.sin(a)*r) : shape.moveTo(Math.cos(a)*r, Math.sin(a)*r); }
    const g = new T.ExtrudeGeometry(shape, { depth:0.014, bevelEnabled:true, bevelThickness:0.006, bevelSize:0.006, bevelSegments:2 });
    g.translate(0, 0, -0.007);
    piece('acc-star', onHair(mesh(g, accY), [0.6, 0.72, 0.36]), skull);
  }

  /* --- skirts hang from the waist and are re-aimed at world down every frame --- */
  const skirtPivot = joint('skirt', char, 0, 0.045, 0);
  const skirtShort = at(mesh(frillGeo(0.098, 0.17, 0.13, 11, 0.07), botM), 0, -0.065, 0);
  skirtShort.scale.z = 0.9; skirtShort.castShadow = false;
  skirtShort.add(at(mesh(frillGeo(0.168, 0.2, 0.035, 16, 0.08), botM), 0, -0.078, 0)); // ruffle tier at the hem
  const skirtLong = at(mesh(frillGeo(0.098, 0.2, 0.3, 13, 0.06), botM), 0, -0.15, 0);
  skirtLong.scale.z = 0.9; skirtLong.castShadow = false;
  skirtLong.traverse(o => o.castShadow = false); skirtShort.traverse(o => o.castShadow = false);
  piece('skirtShort', skirtShort, skirtPivot);
  piece('skirtLong', skirtLong, skirtPivot);
  piece('skirtShort', at(mesh(new T.TorusGeometry(0.098, 0.008, 6, 40), botM), 0, 0, 0), skirtPivot).rotation.x = PI/2;
  piece('skirtLong', at(mesh(new T.TorusGeometry(0.098, 0.008, 6, 40), botM), 0, 0, 0), skirtPivot).rotation.x = PI/2;

  char.traverse(o => { if (o.isMesh) o.receiveShadow = false; }); // toon look: no self-shadow bands
  char.position.set(0, STAND_Y, 0);

  const emote = new T.Sprite(new T.SpriteMaterial({ map:emoteTex.heart, transparent:true, depthWrite:false, toneMapped:false, opacity:0 }));
  emote.renderOrder = 10; emote.visible = false; scene.add(emote);

  const av = {
    holder, char, J, P, skull, emote, faceM, faceTex, faceCanvases,
    mats:{ skinM, topM, botM, hairM, shoeM }, skirtPivot, skirtShort, skirtLong, tailPivot, longPivot,
    outfit: look,
    // what animateAvatar() shows; the player's controls or the network fill these in
    pose:'stand', onPole:false, faceMode:'auto', moveAmp:0, walkPhase:0, spinVel:0, nameShown:true,
    hopAt:-9, landAt:-9, emoteAt:-9, blinkAt:3, blinking:0,
  };
  dressAvatar(av);
  return av;
}
// remove an avatar (a player who left); shared materials and the lace texture stay
function removeAvatar(av){
  const own = new Set([...Object.values(av.mats), av.faceM, av.emote.material]);
  av.holder.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  own.forEach(m => m.dispose());
  Object.values(av.faceTex).forEach(t => t.dispose());
  scene.remove(av.holder); scene.remove(av.emote);
}

let outfit = Object.assign({}, DEFAULT);

let savedLook = null;
try { savedLook = JSON.parse(localStorage.getItem('pole-outfit-v2') || 'null'); } catch (e) {}
if (savedLook) outfit = Object.assign(outfit, savedLook);
else [OPTIONS, COLORS].forEach(set => Object.keys(set).forEach(k => { outfit[k] = set[k][Math.random()*set[k].length | 0][0]; }));

// show the pieces and colors of av.outfit on that avatar
function dressAvatar(av){
  const o = av.outfit, { topM, botM, hairM, skinM } = av.mats;
  const on = new Set([...TOP_PARTS[o.top], ...BOT_PARTS[o.bottom], o.hair, 'acc-' + o.acc]);
  if (o.shoes === 'heels'){ on.add('heell'); on.add('heelr'); }
  Object.entries(av.P).forEach(([k, list]) => list.forEach(m => { m.visible = on.has(k); }));
  topM.color.copy(tcol(o.topColor));
  botM.color.copy(tcol(o.bottomColor));
  topM.map = o.top === 'lace' ? laceTex : null; topM.needsUpdate = true;
  botM.map = o.bottom === 'laceSkirt' ? laceTex : null; botM.needsUpdate = true;
  hairM.color.copy(tcol(o.hairColor));
  skinM.color.copy(tcol(o.skin));
  EXPRS.forEach(n => { drawFace(av.faceCanvases[n], n, o.eyeColor, o.hairColor); av.faceTex[n].needsUpdate = true; });
}

// the player's own avatar; input, camera and the name tag work on it through these names
const me = createAvatar(outfit);
const { holder, char, J, skull } = me;
const others = [];   // everyone else drawn in the park: test bots and other players

function applyOutfit(){
  dressAvatar(me);
  try { localStorage.setItem('pole-outfit-v2', JSON.stringify(outfit)); } catch (e) {}
  syncWardrobe();
  netSend({ t:'outfit', look:outfit });
}

    p:[-0.09,1.5,0], up:[-0.85,0.53,0], fwd:[0.53,0.85,0],
    j:{ spine:[-0.15,0,0], chest:[-0.2,0,0], neck:[-0.25,0,0], head:[-0.45,0,0],
        lFoot:[0.8,0,0], rFoot:[0.8,0,0] },
    ik:{ rArm:{ t:[-0.01,1.58,0.05], h:[-0.3,-1,0.4] },
         lArm:{ t:[-0.01,1.52,-0.05], h:[-0.3,-1,-0.4] },
         rLeg:{ t:[0.02,1.82,0.03], h:[-1,0,0] },
         lLeg:{ t:[-0.03,1.2,-0.04], h:[-1,0,0] } } },
};
const MOVE_ORDER = ['chair','ppose','hera','brass','split'];
const JOINTS = ['spine','chest','neck','head','lUp','lFore','lHand','rUp','rFore','rHand','lThigh','lShin','lFoot','rThigh','rShin','rFoot'];
const LIMBS = {
  lArm:{ a:'lUp', b:'lFore', L1:0.13, L2:0.152, arm:true },
  rArm:{ a:'rUp', b:'rFore', L1:0.13, L2:0.152, arm:true },
  lLeg:{ a:'lThigh', b:'lShin', L1:0.14, L2:0.135, arm:false },
  rLeg:{ a:'rThigh', b:'rShin', L1:0.14, L2:0.135, arm:false },

// precompute root quaternions
const _m4 = new T.Matrix4();
Object.values(POSES).forEach(p => {
  if (p.up){
    const y = new V3(...p.up).normalize();
    const z = new V3(...p.fwd); z.addScaledVector(y, -z.dot(y)).normalize();
    const x = new V3().crossVectors(y, z).normalize();
    p.q = new Q().setFromRotationMatrix(_m4.makeBasis(x, y, z));
  } else p.q = new Q().setFromEuler(new T.Euler(...p.r));

  Object.keys(p.ik || {}).forEach(k => { p.ikSkip.add(LIMBS[k].a); p.ikSkip.add(LIMBS[k].b); });

/* ---------- two-bone IK ---------- */
const _S = new V3(), _Tt = new V3(), _H = new V3(), _E = new V3(), _d = new V3(), _b = new V3(), _HZ = new V3();
const _bx = new V3(), _by = new V3(), _bz = new V3(), _bm = new T.Matrix4();
const _qa = new Q(), _qb = new Q(), _qp = new Q(), _ql = new Q(), _dirA = new V3(), _dirB = new V3(), _Tc = new V3();
function boneQuat(dir, hz, out){
  _by.copy(dir).negate();
  _bz.copy(hz).addScaledVector(_by, -hz.dot(_by));
  if (_bz.lengthSq() < 1e-6){ _bz.set(0, 0, 1).addScaledVector(_by, -_by.z); }
  _bz.normalize();
  _bx.crossVectors(_by, _bz).normalize();
  _bz.crossVectors(_bx, _by);
  return out.setFromRotationMatrix(_bm.makeBasis(_bx, _by, _bz));
}
function solveIK(av, limb, spec, k){
  const A = av.J[limb.a], B = av.J[limb.b];
  _Tt.set(...spec.t); av.holder.localToWorld(_Tt);
  _H.set(...spec.h).normalize().applyQuaternion(av.holder.quaternion);
  A.getWorldPosition(_S);
  _d.subVectors(_Tt, _S);
  let dist = _d.length(); _d.normalize();
  const L1 = limb.L1, L2 = limb.L2;
  dist = Math.min(L1 + L2 - 0.002, Math.max(Math.abs(L1 - L2) + 0.01, dist));
  const cosA = (L1*L1 + dist*dist - L2*L2) / (2*L1*dist);
  const sinA = Math.sqrt(Math.max(0, 1 - cosA*cosA));
  _b.copy(_H).addScaledVector(_d, -_H.dot(_d));
  if (_b.lengthSq() < 1e-6) _b.set(0, 1, 0).addScaledVector(_d, -_d.y);
  _b.normalize();
  _E.copy(_S).addScaledVector(_d, cosA*L1).addScaledVector(_b, sinA*L1);
  _Tc.copy(_S).addScaledVector(_d, dist);
  _HZ.copy(_H); if (limb.arm) _HZ.negate();
  _dirA.subVectors(_E, _S).normalize();
  boneQuat(_dirA, _HZ, _qa);
  A.parent.getWorldQuaternion(_qp);
  _ql.copy(_qp).invert().multiply(_qa);
  A.quaternion.slerp(_ql, k);
  _dirB.subVectors(_Tc, _E).normalize();
  boneQuat(_dirB, _HZ, _qb);
  _ql.copy(_qa).invert().multiply(_qb);
  B.quaternion.slerp(_ql, k);
}

/* ---------- state ---------- */
let mode = 'roam';          // roam | approach | pole
let poseName = 'stand';
let poseStart = 0, poseYaw = 0;
let walkTarget = null, queuedMove = null, pendingLeave = null;
let spinPole = false, clock = 0;
const keys = {};

holder.position.set(0.9, 0, 1.6); holder.rotation.y = 0.35;

const _q = new Q(), _q2 = new Q(), _q3 = new Q(), _v = new V3(), _e = new T.Euler(), DOWN = new V3(0, -1, 0);
const tmpWP = new V3(), tmpWQ = new Q();

function rebase(pos, rotY){
  holder.updateMatrixWorld(true);
  char.getWorldPosition(tmpWP); char.getWorldQuaternion(tmpWQ);
  holder.position.copy(pos); holder.rotation.set(0, rotY, 0); holder.updateMatrixWorld(true);
  const inv = holder.quaternion.clone().invert();
  char.position.copy(tmpWP.sub(holder.position).applyQuaternion(inv));
  char.quaternion.copy(inv.multiply(tmpWQ));
}
function setPose(name){
  poseName = name; poseStart = clock; poseYaw = yaw;

  netState(POSES[name].emote);
  if (MOVE_ORDER.includes(name)) polkTrack('pose_start', { pose:name });
  updateUI();
}
function startMove(name){
  if (mode === 'pole'){ pendingLeave = null; setPose(name); return; }
  standUp(); sitQueued = null;
  const wp = holder.position;
  const a = Math.atan2(wp.x - POLE.x, wp.z - POLE.z);
  walkTarget = new V3(POLE.x + Math.sin(a)*0.34, 0, POLE.z + Math.cos(a)*0.34);
  queuedMove = name; mode = 'approach'; updateUI();
}
function enterPole(){
  const a = Math.atan2(holder.position.x - POLE.x, holder.position.z - POLE.z);
  rebase(POLE.clone(), a + PI);
  mode = 'pole'; walkTarget = null; me.hopAt = clock;
  netSend({ t:'pole' });

}
function requestLeave(target){

}
function doLeave(){
  holder.updateMatrixWorld(true);
  char.getWorldPosition(_v);
  const fwd = new V3(0, 0, 1).applyQuaternion(char.getWorldQuaternion(_q));
  rebase(new V3(_v.x, 0, _v.z), Math.atan2(fwd.x, fwd.z));
  mode = 'roam'; walkTarget = pendingLeave && pendingLeave.target; pendingLeave = null;
  me.spinVel = 0; me.landAt = clock; netSend({ t:'unpole' }); setPose('stand');
}
function goTo(p){
  sitQueued = null;
  if (mode === 'pole'){ requestLeave(p); return; }
  standUp();
  mode = 'roam'; queuedMove = null; walkTarget = p; updateUI();
}
const walkable = (x, z) => Math.hypot(x, z - 1) < 8.5 && !inLake(x, z, 0.8) && OBSTACLES.every(([ox, oz, r]) => Math.hypot(x - ox, z - oz) > r);

const stepOK = (x0, z0, x1, z1) => Math.hypot(x1, z1 - 1) < 8.5 && !inLake(x1, z1, 0.8)
  && OBSTACLES.every(([ox, oz, r]) => { const d1 = Math.hypot(x1 - ox, z1 - oz); return d1 > r || d1 > Math.hypot(x0 - ox, z0 - oz); });

/* ---------- sitting: on the grass wherever she is, or on a bench ---------- */
let sitAt = null, sitQueued = null;   // null | 'ground' | a bench
const benchFront = b => new V3(b.x + Math.sin(b.rot)*0.95, 0, b.z + Math.cos(b.rot)*0.95);
function sitDown(target){
  polkTrack('sit', { spot: target === 'ground' ? 'ground' : 'bench' });
  walkTarget = null; sitQueued = null;
  if (target === 'ground'){ sitAt = 'ground'; setPose('sitGround'); return; }
  rebase(new V3(target.x, 0, target.z), target.rot);
  sitAt = target; setPose('sitBench');
}
function standUp(){
  if (!sitAt) return;
  if (sitAt !== 'ground') rebase(benchFront(sitAt), sitAt.rot);
  sitAt = null; setPose('stand');
}
function goSitBench(b){
  if (mode === 'pole'){ requestLeave(benchFront(b)); sitQueued = b; return; }
  standUp(); mode = 'roam'; queuedMove = null; walkTarget = benchFront(b); sitQueued = b; updateUI();
}
function toggleSit(){
  if (sitAt){ standUp(); return; }
  if (sitQueued){ sitQueued = null; updateUI(); return; }
  if (mode === 'pole'){ requestLeave(null); sitQueued = 'ground'; updateUI(); return; }
  if (mode === 'roam' && walkTarget){ sitQueued = 'ground'; updateUI(); return; }   // sit down where she is headed
  const near = BENCHES.find(b => Math.hypot(holder.position.x - b.x, holder.position.z - b.z) < 2.2);

/* ---------- camera orbit ---------- */
let yaw = 0.05, pitch = 0.12, camDist = 3.6, wide = false;
const camTarget = new V3(0, 0.7, 0);
function updateCamera(dt){
  holder.updateMatrixWorld(true);
  char.getWorldPosition(_v);
  const goal = wide ? new V3(_v.x*0.4, 1.5, _v.z*0.4) : new V3(_v.x, Math.max(0.55, _v.y + 0.2), _v.z);
  camTarget.lerp(goal, 1 - Math.exp(-4*dt));
  const d = wide ? Math.max(camDist, 7) : camDist;
  camera.position.set(
    camTarget.x + Math.sin(yaw)*Math.cos(pitch)*d,
    Math.max(0.25, camTarget.y + Math.sin(pitch)*d),
    camTarget.z + Math.cos(yaw)*Math.cos(pitch)*d);
  camera.lookAt(camTarget);
  sky.position.copy(camera.position);
}

/* ---------- per-frame ---------- */
function angLerp(a, b, t){ let d = b - a; d = Math.atan2(Math.sin(d), Math.cos(d)); return a + d*t; }
function update(dt){
  clock += dt;
  waterUniforms.t.value = clock;
  clouds.forEach(c => { c.position.x += c.userData.v*dt; if (c.position.x > 220) c.position.x = -220; });
  updateButterflies(clock);
  if (marker.material.opacity > 0){ marker.material.opacity = Math.max(0, marker.material.opacity - dt*0.8); marker.scale.setScalar(1 + (1 - marker.material.opacity)*0.6); }

  let f = 0, s = 0;
  if (keys.up) f += 1; if (keys.down) f -= 1;
  if (keys.right) s += 1; if (keys.left) s -= 1;
  let keyDir = null;
  if (f || s){
    keyDir = new V3(-Math.sin(yaw)*f + Math.cos(yaw)*s, 0, -Math.cos(yaw)*f - Math.sin(yaw)*s).normalize();
    if (mode === 'pole'){ if (!pendingLeave) requestLeave(null); keyDir = null; }
    else if (mode === 'approach'){ mode = 'roam'; queuedMove = null; walkTarget = null; updateUI(); }
  }
  if (mode === 'pole' && pendingLeave && poseName === 'ready' && clock - poseStart > 1.3) doLeave();

  let moving = false;
  if (mode === 'roam' || mode === 'approach'){
    let dir = null, dist = Infinity;
    if (keyDir){ dir = keyDir; walkTarget = null; sitQueued = null; standUp(); }
    else if (walkTarget){
      _v.set(walkTarget.x - holder.position.x, 0, walkTarget.z - holder.position.z);
      dist = _v.length();
      if (dist < (mode === 'approach' ? 0.03 : 0.06)){ walkTarget = null; if (mode === 'approach') enterPole(); }
      else dir = _v.normalize().clone();
    }
    if (dir && mode !== 'pole'){
      const step = Math.min(1.25*dt, dist);
      const nx = holder.position.x + dir.x*step, nz = holder.position.z + dir.z*step;
      // only block steps that go further into the pole's space (after coming down she stands inside it)
      const dNew = Math.hypot(nx - POLE.x, nz - POLE.z), dOld = Math.hypot(holder.position.x - POLE.x, holder.position.z - POLE.z);
      const nearPole = dNew < (mode === 'approach' ? 0.3 : 0.4) && dNew < dOld;
      if (stepOK(holder.position.x, holder.position.z, nx, nz) && !nearPole){ holder.position.x = nx; holder.position.z = nz; moving = true; }
      else if (mode === 'approach' && nearPole){ enterPole(); }
      else { walkTarget = null; }
      if (mode !== 'pole') holder.rotation.y = angLerp(holder.rotation.y, Math.atan2(dir.x, dir.z), 1 - Math.exp(-10*dt));
    }
    if (mode === 'roam' && sitQueued && !walkTarget && !keyDir) sitDown(sitQueued);   // arrived (or stopped): sit here
  }
  me.moveAmp += ((moving ? 1 : 0) - me.moveAmp)*(1 - Math.exp(-8*dt));
  me.walkPhase += dt*11*me.moveAmp;

  if (mode === 'pole'){
    const view = POSES[poseName].view;
    if (spinPole && poseName !== 'ready'){
      me.spinVel += (-0.65 - me.spinVel)*(1 - Math.exp(-2.5*dt));
      holder.rotation.y += me.spinVel*dt;
    } else {
      me.spinVel *= Math.exp(-3*dt);
      holder.rotation.y += me.spinVel*dt;
      if (view != null) holder.rotation.y = angLerp(holder.rotation.y, poseYaw - view, 1 - Math.exp(-1.6*dt));
    }
  }

  me.pose = poseName; me.onPole = mode === 'pole'; me.faceMode = faceMode;
  animateAvatar(me, dt);
  others.forEach(av => { if (av.bot) updateBot(av, dt); if (av.net) updateRemote(av, dt); animateAvatar(av, dt); });
  netTick(dt);
  updateCamera(dt);
}

// pose one avatar from its state: face, hop/squash, root and joint blending, IK grips, hair and skirts
function animateAvatar(av, dt){
  const { holder, char, J } = av, pose = POSES[av.pose];

  // blink
  if (clock > av.blinkAt){ av.blinking = 0.13; av.blinkAt = clock + 2.5 + Math.random()*3; }
  if (av.blinking > 0) av.blinking -= dt;
  const expr = av.faceMode !== 'auto' ? av.faceMode : (av.onPole && pose.face) || 'open';
  av.faceM.map = av.faceTex[av.blinking > 0 && (expr === 'open' || expr === 'wow') ? 'blink' : expr];

  // hop up onto the pole, squash a little when landing back on the ground
  const tHop = clock - av.hopAt, tLand = clock - av.landAt;
  const squash = tLand < 0.35 ? Math.sin(tLand/0.35*PI)*0.14 : 0;
  holder.position.y = (tHop < 0.4 ? Math.sin(tHop/0.4*PI)*0.16 : 0) - squash*STAND_Y;
  char.scale.set(1 + squash*0.5, 1 - squash, 1 + squash*0.5);

  // blend root toward the pose
  const heels = av.outfit.shoes === 'heels' && (av.pose === 'stand' || av.pose === 'ready');
  const lift = (heels ? 0.022 : 0)
    + (Math.hypot(holder.position.x - POLE.x, holder.position.z - POLE.z) < 1.38 ? STAGE_H : 0);
  const walkBob = Math.abs(Math.sin(av.walkPhase))*0.03*av.moveAmp;
  const sway = av.onPole && av.pose !== 'ready' ? Math.sin(clock*1.3)*0.012 : 0;
  const k = 1 - Math.exp(-(av.onPole ? 4 : 10)*dt);
  _v.set(pose.p[0], pose.p[1] + lift + walkBob + sway, pose.p[2]);
  char.position.lerp(_v, k);
  char.quaternion.slerp(pose.q, k);

  const sw = Math.sin(av.walkPhase)*av.moveAmp;
  const breath = Math.sin(clock*1.6)*0.018;
  JOINTS.forEach(n => {
    if (pose.ikSkip.has(n)) return;
    const b = pose.j[n] || [0,0,0];
    let x = b[0], y = b[1], z = b[2];
    if (av.moveAmp > 0.001){
      if (n === 'lThigh') x += -0.6*sw;
      if (n === 'rThigh') x +=  0.6*sw;
      if (n === 'lShin')  x += Math.max(0,  Math.sin(av.walkPhase - 0.9))*0.65*av.moveAmp;
      if (n === 'rShin')  x += Math.max(0, -Math.sin(av.walkPhase - 0.9))*0.65*av.moveAmp;
      if (n === 'lUp')    x +=  0.5*sw;
      if (n === 'rUp')    x += -0.5*sw;
      if (n === 'spine')  y += 0.08*sw;
    }
    if (n === 'chest') x += breath;
    if (av.pose === 'sitBench' && (n === 'lShin' || n === 'rShin')) x += Math.sin(clock*3.2 + (n === 'lShin' ? 0 : PI))*0.28;   // swinging feet
    if (heels && (n === 'lFoot' || n === 'rFoot')) x += 0.35;
    _q.setFromEuler(_e.set(x, y, z));
    J[n].quaternion.slerp(_q, k);
  });

  // IK grips on the pole
  holder.updateMatrixWorld(true);
  const kIK = 1 - Math.exp(-(av.onPole ? 9 : 14)*dt);
  Object.entries(pose.ik || {}).forEach(([name, spec]) => solveIK(av, LIMBS[name], spec, kIK));

  // hair and skirts hang with gravity; skirts flare while spinning
  holder.updateMatrixWorld(true);
  hang(av.skirtPivot, char, 0.82, dt, 7);
  hang(av.tailPivot, J.head, 0.85, dt, 9);
  hang(av.longPivot, J.head, 0.7, dt, 9);
  const flare = Math.min(1, Math.abs(av.spinVel)/2.5);
  av.skirtShort.scale.set(1 + 0.3*flare, 1, 0.9 + 0.3*flare);
  av.skirtLong.scale.set(1 + 0.4*flare, 1 - 0.1*flare, 0.9 + 0.4*flare);

  updateEmote(av);
}
function hang(pivot, parent, amount, dt, rate){
  parent.getWorldQuaternion(_q2); _q2.invert();
  _v.set(0, -1, 0).applyQuaternion(_q2).normalize();
  _q3.setFromUnitVectors(DOWN, _v);
  _q2.identity().slerp(_q3, amount);
  pivot.quaternion.slerp(_q2, 1 - Math.exp(-rate*dt));
}

/* ---------- input ---------- */
const pointers = new Map();
let down = null, pinch0 = 0, dist0 = 0;
const pdist = () => { const [a, b] = [...pointers.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 1) down = { x:e.clientX, y:e.clientY, moved:false };
  if (pointers.size === 2){ pinch0 = pdist(); dist0 = camDist; if (down) down.moved = true; }
});
canvas.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId); if (!prev) return;
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  prev.x = e.clientX; prev.y = e.clientY;
  if (pointers.size === 1 && down){
    if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) down.moved = true;
    if (down.moved){ yaw -= dx*0.006; pitch = Math.min(1.25, Math.max(-0.2, pitch + dy*0.004)); }
  } else if (pointers.size === 2){
    camDist = Math.min(12, Math.max(1.0, dist0*pinch0/Math.max(1, pdist())));
  }
});
function endPointer(e){
  if (pointers.size === 1 && down && !down.moved && e.type === 'pointerup') clickGround(e);
  pointers.delete(e.pointerId);
  if (!pointers.size) down = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); camDist = Math.min(12, Math.max(1.0, camDist*(1 + Math.sign(e.deltaY)*0.1))); }, { passive:false });

const ray = new T.Raycaster(), groundPlane = new T.Plane(new V3(0, 1, 0), 0);
function clickGround(e){
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera({ x:((e.clientX - r.left)/r.width)*2 - 1, y:-((e.clientY - r.top)/r.height)*2 + 1 }, camera);
  const seat = ray.intersectObjects(BENCHES.map(b => b.mesh), true)[0];
  if (seat){ const b = BENCHES.find(b => b.mesh === seat.object.parent); if (b){ goSitBench(b); return; } }
  const hit = new V3();
  if (!ray.ray.intersectPlane(groundPlane, hit)) return;
  if (Math.hypot(hit.x - POLE.x, hit.z - POLE.z) < 0.6) return;
  if (!walkable(hit.x, hit.z)) return;
  marker.position.set(hit.x, 0.03, hit.z); marker.material.opacity = 0.9; marker.scale.setScalar(1);
  goTo(hit);
}
// physical keys (e.code), so WASD / 1–5 / Q still work while a Korean input source is active
const DIRS = { KeyW:'up', ArrowUp:'up', KeyS:'down', ArrowDown:'down', KeyA:'left', ArrowLeft:'left', KeyD:'right', ArrowRight:'right' };
window.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input, textarea')) return;   // typing a nickname
  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  const dir = DIRS[e.code] || DIRS[e.key];
  if (dir){ keys[dir] = true; e.preventDefault(); return; }   // arrows must not scroll the panels instead
  if (e.repeat) return;
  if (e.key === 'Escape' || e.code === 'KeyQ') requestLeave(null);

window.addEventListener('keyup', e => { const dir = DIRS[e.code] || DIRS[e.key]; if (dir) keys[dir] = false; });

// background music: a small music-box / kalimba loop synthesized with Web Audio (no audio files, no licensing).
// Browsers only allow sound after a user gesture, so it starts from the entry button or the BGM toggle.
const MUSIC = (() => {
  const N = n => 440*Math.pow(2, (n - 69)/12);
  const _ = null;
  // instruments: each schedules one note at time t on the shared buses
  function instruments(ctx, bus, dry){
    let noise = null;
    const env = (g, t, peak, attack, end) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, end); };
    const osc = (type, f, t, end, dest) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.connect(dest); o.start(t); o.stop(end + 0.05); return o; };
    return {
      bell(t, m, vol, decay){            // kalimba / music box: sine + quiet bright partials
        [[1, vol, 1], [3.01, vol*0.12, 0.35], [2, vol*0.18, 0.35]].forEach(([mul, v, k]) => {
          const g = ctx.createGain(); env(g, t, v, 0.006, t + decay*k); g.connect(bus); osc('sine', N(m)*mul, t, t + decay, g); });
      },
      keys(t, m, vol, decay){             // warm electric piano: FM bell attack that mellows out
        const g = ctx.createGain(); env(g, t, vol, 0.01, t + decay); g.connect(bus);
        const car = osc('sine', N(m), t, t + decay, g);
        const mod = ctx.createOscillator(), mg = ctx.createGain(); mod.frequency.value = N(m)*1.0;
        mg.gain.setValueAtTime(N(m)*1.6, t); mg.gain.exponentialRampToValueAtTime(N(m)*0.05, t + 0.5);
        mod.connect(mg); mg.connect(car.frequency); mod.start(t); mod.stop(t + decay + 0.05);
      },
      bass(t, m, vol, len){
        const g = ctx.createGain(), lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 480;
        env(g, t, vol, 0.02, t + len); lp.connect(g); g.connect(dry); osc('triangle', N(m), t, t + len, lp);
      },
      hat(t, vol){
        if (!noise){ noise = ctx.createBuffer(1, ctx.sampleRate*0.2, ctx.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
        const src = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
        src.buffer = noise; hp.type = 'highpass'; hp.frequency.value = 7000; env(g, t, vol, 0.002, t + 0.06);
        src.connect(hp); hp.connect(g); g.connect(dry); src.start(t); src.stop(t + 0.1);
      },
      kick(t, vol){
        const g = ctx.createGain(), o = osc('sine', 110, t, t + 0.35, g);
        o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.18);
        env(g, t, vol, 0.004, t + 0.32); g.connect(dry);
      },
    };
  }
  // tracks: steps per bar (eighth notes), bars in the loop, and what plays on each step
  const TRACKS = {
    musicbox: { name:'오르골 소풍', bpm:84, steps:8, bars:8, verb:0.28,
      chords:[[48,[60,64,67]], [43,[59,62,67]], [45,[60,64,69]], [41,[60,65,69]], [48,[60,64,67]], [43,[59,62,67]], [41,[60,65,69]], [43,[59,62,67]]],
      mel:[[76,_,79,_,81,79,76,_], [74,_,79,_,71,_,74,_], [72,_,76,_,81,_,79,76], [77,_,76,74,72,_,_,_],
           [76,_,79,_,84,_,83,81], [79,_,74,_,79,81,83,_], [81,_,79,77,76,_,74,_], [74,_,76,_,79,_,_,_]],
      play(I, t, bar, e, loop, E){
        const [root, tones] = this.chords[bar], m = this.mel[bar][e];
        if (m != null && !(loop % 2 && e % 2 === 0 && Math.random() < 0.15)) I.bell(t, m + (loop % 4 === 3 ? 12 : 0), 0.13, 1.6);
        I.bell(t, tones[[0, 2, 1, 2][e % 4]] - 12, 0.045, 0.9);
        if (e === 0 || e === 4) I.bass(t, root, 0.16, E*3.6);
      } },
    lofi: { name:'노을 로파이', bpm:74, steps:8, bars:8, verb:0.3, swing:0.18,
      chords:[[48,[60,64,67,71]], [45,[57,60,64,67]], [50,[62,65,69,72]], [43,[59,62,65,67]], [48,[60,64,67,71]], [45,[57,60,64,67]], [41,[65,69,72,76]], [43,[59,62,65,67]]],
      mel:[[_,_,76,_,79,_,83,_], [84,_,_,_,81,_,79,_], [77,_,_,81,_,79,77,_], [74,_,_,_,_,_,71,_],
           [76,_,79,_,83,_,86,_], [84,_,_,79,_,_,76,_], [81,_,79,_,77,_,76,_], [74,_,_,_,79,_,_,_]],
      play(I, t, bar, e, loop, E){
        const [root, tones] = this.chords[bar], m = this.mel[bar][e];
        if (e === 0) tones.forEach(n => I.keys(t, n - 12, 0.04, 2.6));
        if (e === 5) tones.slice(1).forEach(n => I.keys(t, n - 12, 0.025, 1.2));
        if (e === 0 || e === 6) I.bass(t, root, 0.16, E*(e ? 2 : 3.5));
        if (m != null && (loop % 2 === 0 || e % 4 !== 2)) I.keys(t, m, 0.05, 1.4);   // second pass leaves a few notes out
        if (e === 0 || e === 5) I.kick(t, 0.12);

        if (e === 4) I.hat(t, 0.04);

    const master = ctx.createGain(); master.gain.value = 0; master.connect(out);
    const verb = ctx.createConvolver(), len = ctx.sampleRate*2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/len, 3.2); }
    verb.buffer = ir;
    const wet = ctx.createGain(); verb.connect(wet); wet.connect(master);
    const dry = ctx.createGain(); dry.gain.value = 0.8; dry.connect(master);
    const bus = ctx.createGain(); bus.connect(dry); bus.connect(verb);
    const I = instruments(ctx, bus, dry);
    let track = TRACKS[trackId] || TRACKS.musicbox, step = 0, nextT = 0, timer = 0, loop = 0;
    wet.gain.value = track.verb;
    function schedule(until = ctx.currentTime + 0.2){
      const E = 60/track.bpm/2;
      while (nextT < until){
        const per = track.steps, bar = Math.floor(step/per) % track.bars, e = step % per;
        const t = nextT + (track.swing && e % 2 ? track.swing*E : 0);
        track.play(I, t, bar, e, loop, E);
        step++; if (step % (per*track.bars) === 0) loop++;
        nextT += E;
      }
    }
    return {
      start(){ nextT = ctx.currentTime + 0.08; step = 0; loop = 0; clearInterval(timer); timer = setInterval(() => schedule(), 40); schedule();
               master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(0.75, ctx.currentTime, 0.6); },
      stop(){ master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(0, ctx.currentTime, 0.25); clearInterval(timer); timer = 0; },
      setTrack(id){ track = TRACKS[id] || track; wet.gain.value = track.verb; step = 0; loop = 0; },
      preview(seconds){ nextT = 0.05; master.gain.value = 0.75; schedule(seconds); }   // offline rendering (OfflineAudioContext)
    };
  }
  return { create, TRACKS };
})();

// iPhone (Safari, and Chrome/KakaoTalk which use the same engine) mutes Web Audio while the ring/silent switch
// is on. Declaring the page as music playback lifts that: the audioSession API on iOS 17+, and on older iOS
// a looping silent <audio> element started from the same tap, which switches the page into playback mode.
let silentLoop = null;
function unmuteIOS(){
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (!/iPad|iPhone|iPod/.test(navigator.userAgent) && !(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return;
  if (!silentLoop){
    const n = 4000, buf = new Uint8Array(44 + n), v = new DataView(buf.buffer);   // 0.5 s of 8 kHz 8-bit silence
    [...'RIFF'].forEach((c, i) => buf[i] = c.charCodeAt(0)); v.setUint32(4, 36 + n, true);
    [...'WAVEfmt '].forEach((c, i) => buf[8 + i] = c.charCodeAt(0)); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    [...'data'].forEach((c, i) => buf[36 + i] = c.charCodeAt(0)); v.setUint32(40, n, true); buf.fill(128, 44);
    silentLoop = new Audio('data:audio/wav;base64,' + btoa(String.fromCharCode(...buf)));
    silentLoop.loop = true; silentLoop.setAttribute('playsinline', '');
  }
  silentLoop.play().catch(() => {});
}
function startMusic(){
  try {
    unmuteIOS();
    if (!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); music = MUSIC.create(audioCtx, audioCtx.destination, bgmTrack); }
    audioCtx.resume(); music.start();
  } catch (e) {}
}

  bgmOn = on; syncBgm();
  try { localStorage.setItem('pole-bgm', on ? '1' : '0'); } catch (e) {}
  if (on) startMusic(); else { if (music) music.stop(); if (silentLoop) silentLoop.pause(); }
}

const pick = list => list[Math.random()*list.length | 0][0];
function randomLook(){

  Object.keys(COLORS).forEach(k => o[k] = pick(COLORS[k]));
  return o;
}
let botRange = 7;   // how far from the middle bots wander (the benchmark keeps them on screen)
function randomSpot(){
  for (let i = 0; i < 50; i++){
    const x = (Math.random()*2 - 1)*botRange, z = 1 + (Math.random()*2 - 1)*botRange;
    if (walkable(x, z) && Math.hypot(x - POLE.x, z - POLE.z) > 1.6) return new V3(x, 0, z);
  }
  return new V3(2, 0, 3);
}
function addBot(){
  const av = createAvatar(randomLook(), 0.5);
  av.holder.position.copy(randomSpot()); av.holder.rotation.y = Math.random()*PI*2;
  av.bot = { target:randomSpot(), rest:Math.random()*3 };
  others.push(av);
}
function setBots(n){
  while (others.length < n) addBot();
  while (others.length > n) removeAvatar(others.pop());
}
// wander between random spots, pausing (and sometimes emoting) in between
function updateBot(av, dt){
  const b = av.bot, h = av.holder.position;
  let moving = false;
  if (b.rest > 0) b.rest -= dt;
  else {
    _v.set(b.target.x - h.x, 0, b.target.z - h.z);
    const d = _v.length();
    if (d < 0.1){
      b.target = randomSpot(); b.rest = 1 + Math.random()*4;
      if (Math.random() < 0.4) showEmote(av, pick([['heart'], ['note'], ['wow'], ['sparkle']]));
    } else {
      _v.normalize();
      const step = Math.min(dt, d), nx = h.x + _v.x*step, nz = h.z + _v.z*step;
      if (stepOK(h.x, h.z, nx, nz) && Math.hypot(nx - POLE.x, nz - POLE.z) > 0.5){
        h.x = nx; h.z = nz; moving = true;
        av.holder.rotation.y = angLerp(av.holder.rotation.y, Math.atan2(_v.x, _v.z), 1 - Math.exp(-10*dt));
      } else b.target = randomSpot();
    }
  }
  av.moveAmp += ((moving ? 1 : 0) - av.moveAmp)*(1 - Math.exp(-8*dt));
  av.walkPhase += dt*11*av.moveAmp;
}

  entry.hidden = true; document.body.classList.add('clean');
  wide = true; botRange = 4; camDist = 13; pitch = 0.55;   // pulled far back so every bot is on screen (worst case)
  if (!bench) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;width:min(320px,calc(100vw - 32px));padding:16px 18px;border-radius:18px;background:rgba(255,250,238,.94);color:#5a4237;font:14px/1.6 "IBM Plex Sans KR",sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.18)';
    document.body.appendChild(el);
    bench = { el };
  }
  Object.assign(bench, { i:0, t0:performance.now(), frames:[], results:[], done:false });
  setBots(BENCH_STEPS[0]);
}
function benchTick(now, ms){
  const b = bench;
  if (b.done) return;
  const t = now - b.t0;
  if (t > BENCH_WARM && ms > 0) b.frames.push(ms);
  b.el.innerHTML = `<b>성능 측정 중</b> (${b.i + 1}/${BENCH_STEPS.length})<br>캐릭터 ${BENCH_STEPS[b.i] + 1}명 · 약 ${Math.ceil(((BENCH_STEPS.length - b.i)*(BENCH_WARM + BENCH_MEASURE) - t)/1000)}초 남음<br><small>화면을 끄거나 다른 앱으로 넘어가지 마세요</small>`;
  if (t < BENCH_WARM + BENCH_MEASURE) return;
  if (!b.frames.length){ b.t0 = now; return; }   // no frames counted (tab was hidden): measure this step again
  const f = b.frames.slice().sort((x, y) => x - y), sum = f.reduce((s, x) => s + x, 0);
  b.results.push({ people:BENCH_STEPS[b.i] + 1, fps:Math.round(1000*f.length/sum), low:Math.round(1000/f[Math.floor(f.length*0.95)]), draw:renderer.info.render.calls });
  if (++b.i < BENCH_STEPS.length){ botRange = BENCH_STEPS[b.i] > 20 ? 6 : 4; setBots(BENCH_STEPS[b.i]); b.t0 = now; b.frames = []; return; }
  b.done = true; setBots(0);
  // room size: the most people that still run smoothly, judged against the rate with nobody else around
  // (phones in low power mode cap pages at 30fps, so an absolute bar would call every step slow)
  const base = b.results[0].fps, capped = base < 45;
  const ok = b.results.filter(r => r.fps >= base*0.9 && r.low >= Math.min(30, base*0.6)).pop();
  const device = `${screen.width}×${screen.height} · 픽셀 ${devicePixelRatio}배(렌더 ${renderer.getPixelRatio()}배)`;
  const lines = ['인원  fps(평균/느릴 때)  draw'].concat(b.results.map(r => `${String(r.people).padStart(2)}명  ${String(r.fps).padStart(3)} / ${String(r.low).padStart(3)}        ${r.draw}`));
  const text = `폴크닉 성능 측정\n${device}\n${navigator.userAgent}\n\n${lines.join('\n')}\n\n부드러운 최대 인원: ${ok ? ok.people + '명' : '1명도 버거움'}${ok && ok === b.results[b.results.length - 1] ? ' 이상' : ''}${capped ? '\n(혼자일 때도 30fps 근처: 저전력 모드 등으로 제한된 상태)' : ''}`;
  b.el.innerHTML = `<b>측정 끝</b><br><small>${device}</small>
    <pre style="margin:8px 0;font:12px/1.6 monospace;white-space:pre">${lines.join('\n')}</pre>
    부드러운 최대 인원: <b>${ok ? ok.people + '명' : '1명도 버거움'}</b>${ok && ok === b.results[b.results.length - 1] ? ' 이상' : ''}
    ${capped ? '<br><small>혼자일 때도 30fps 근처예요. 저전력 모드나 화면 녹화를 끄고 다시 재 주세요.</small>' : ''}
    <div style="margin-top:10px;display:flex;gap:8px"><button type="button" data-a="copy">결과 복사</button><button type="button" data-a="again">다시 측정</button></div>`;
  b.el.querySelectorAll('button').forEach(btn => {
    btn.style.cssText = 'flex:1;padding:8px;border:0;border-radius:12px;background:#ff8fa8;color:#fff;font:inherit;cursor:pointer';
    btn.addEventListener('click', () => {
      if (btn.dataset.a === 'again') return startBench();
      const done = () => { btn.textContent = '복사됨'; };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => prompt('복사해서 보내 주세요', text));
      else prompt('복사해서 보내 주세요', text);
    });
  });
}
{
