/* ---------- multiplayer: other players in the same room (server/, protocol in docs/MULTIPLAYER.md) ---------- */
// dev pages (localhost, or the Mac's address on the same Wi-Fi) talk to `wrangler dev` on the same machine
const NET_DEV = /^(localhost|127\.0\.0\.1|10\.\d+\.\d+\.\d+|172\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+)$/.test(location.hostname);
const NET_URL = NET_DEV ? `ws://${location.hostname}:8787/ws` : 'wss://polknic-ws.yujamong.com/ws';
const NET_ROOMS = 5, ROOM_NAME = n => `${n}번 호숫가`, NET_SEND = 0.1, NET_PING = 25, NET_PONG = 10, WALK = 1.25;
const GROUND_POSES = new Set(['stand', 'sitGround', 'sitBench']);
const net = {
  on:false, ws:null, id:null, room:1, tries:0, retryTimer:0,
  sendT:0, stateT:0, pingT:0, pongBy:0, sent:null, stateDirty:false, emote:null,
  rtt:0.4, pingAt:0, vx:0, vz:0, px:0, pz:0,   // round trip (s) and my own walking velocity, for others to predict where I am
};
const netEl = document.getElementById('netText');
function netPeople(){
  const n = others.filter(av => av.net).length;
  return ROOM_NAME(net.room) + ' · ' + (n ? `폴메이트 ${n}명과 함께 있어요!` : '폴메이트를 기다리는 중이에요');
}
function netStatus(){
  netEl.hidden = !net.on && !net.badName && !net.full;
  netEl.textContent = net.badName ? '닉네임을 바꾸면 같이 놀 수 있어요' : net.full ? `${ROOM_NAME(net.room)}가 꽉 찼어요` : net.id ? netPeople() : net.ws ? '연결 중…' : '혼자 노는 중';
  chatForm.hidden = chatTog.hidden = !net.id;   // chat only while connected
  setRoomsSec.hidden = !net.on && !net.full;
  if (net.id && roomN) roomN[net.room - 1] = others.filter(av => av.net).length + 1;   // my own room's count stays exact between refreshes
  roomButtons();
}
function netSend(m){
  if (net.id && net.ws.readyState === 1) net.ws.send(typeof m === 'string' ? m : JSON.stringify(m));
}
// pose, sitting, face and spin go out together, at most every NET_SEND (clicking around can't flood the server)
function netState(emote){ net.stateDirty = true; if (emote) net.emote = emote; }

/* rooms: picked on the entry screen (last one remembered) or switched in settings; counts come from /rooms */
const ROOMS_URL = NET_URL.replace(/^ws/, 'http').replace(/\/ws$/, '/rooms');
const entryRooms = document.getElementById('entryRooms'), setRooms = document.getElementById('setRooms'), setRoomsSec = document.getElementById('setRoomsSec');
let roomN = null, roomCap = 20;   // people per room (null until the server answers)
try { const r = +localStorage.getItem('pole-room'); if (r >= 1 && r <= NET_ROOMS) net.room = r; } catch (e) {}
function roomButtons(){
  [entryRooms, setRooms].forEach(box => {
    if (!box.children.length) for (let n = 1; n <= NET_ROOMS; n++){
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'room'; b.dataset.room = n;
      b.innerHTML = `<span>${ROOM_NAME(n)}</span><small></small>`;
      b.addEventListener('click', () => pickRoom(n));
      box.appendChild(b);
    }
    box.querySelectorAll('.room').forEach(b => {
      const n = +b.dataset.room, c = roomN && roomN[n - 1];
      const mine = net.id && n === net.room;
      b.setAttribute('aria-pressed', String(n === net.room));
      b.lastChild.textContent = c == null ? '' : `${c}/${roomCap}`;
      b.disabled = c != null && c >= roomCap && !mine;
    });
  });
}
function roomCounts(){
  if (bench) return;
  fetch(ROOMS_URL, { cache:'no-store' }).then(r => r.json()).then(j => {
    roomN = j.rooms; roomCap = j.cap || roomCap;
    entryRooms.hidden = document.getElementById('entryRoomsLabel').hidden = false;
    // first visit (or the remembered room is full): start in the first room with space
    if (!net.on && roomN[net.room - 1] >= roomCap){ const free = roomN.findIndex(c => c != null && c < roomCap); if (free >= 0) net.room = free + 1; }
    roomButtons();
  }).catch(() => {});   // no server: no picker, solo play as before
}
function pickRoom(n){
  if (n === net.room && net.id) return;   // already here
  net.room = n; net.full = false;
  try { localStorage.setItem('pole-room', String(n)); } catch (e) {}
  if (entry.hidden){   // already playing: hop over
    const ws = net.ws;
    if (ws){ net.ws = null; net.id = null; net.sent = null; ws.onclose = null; try { ws.close(); } catch (e) {} clearRemotes(); }
    net.on = false; net.tries = 0; netStart();
  }
  netStatus();
}
roomButtons(); roomCounts();
setInterval(() => { if (!entry.hidden || !settings.hidden) roomCounts(); }, 8000);   // keep the counts fresh while a picker is on screen

function netStart(){
  if (net.on || bench) return;
  try { localStorage.setItem('pole-room', String(net.room)); } catch (e) {}
  // everyone starts at the same spot; step a little aside so new players don't stand inside each other
  if (mode === 'roam' && !sitAt && !walkTarget && holder.position.distanceTo(new V3(0.9, 0, 1.6)) < 0.01){
    for (let i = 0; i < 20; i++){
      const a = Math.random()*PI*2, r = 0.6 + Math.random()*1.4, x = 0.9 + Math.sin(a)*r, z = 1.9 + Math.cos(a)*r;
      if (walkable(x, z) && Math.hypot(x - POLE.x, z - POLE.z) > 1.5){ holder.position.set(x, 0, z); break; }
    }
  }
  net.on = true; netConnect();
}
function netConnect(){
  clearTimeout(net.retryTimer);
  if (net.ws || !net.on) return;
  let ws;
  try { ws = new WebSocket(`${NET_URL}?room=${net.room}`); } catch (e) { netRetry(); return; }
  net.ws = ws; netStatus();
  ws.onopen = () => {
    const h = holder.position;
    ws.send(JSON.stringify({ t:'join', name:playerName, look:outfit, face:faceMode, x:h.x, z:h.z, ry:wrapAng(holder.rotation.y) }));
    net.pingT = 0; net.pongBy = 0; net.pingAt = performance.now();   // join → welcome is the first round-trip sample
  };
  ws.onmessage = e => netMessage(e.data);
  ws.onclose = e => netClosed(ws, e.code);
}
// lost the connection (closed, timed out or full): drop everyone else and try again
function netClosed(ws, code){
  if (ws !== net.ws) return;
  net.ws = null; net.id = null; net.sent = null;
  clearRemotes();
  if (code === 4002){   // the server refused my nickname: stop until it's changed in settings
    net.on = false; net.badName = true; toast('닉네임에 쓸 수 없는 말이 있어서 혼자 놀아요. 설정에서 바꿔 주세요');
  } else if (code === 4001){   // the room filled up before I got in: stay alone until another room is picked
    net.on = false; net.full = true; toast(`${ROOM_NAME(net.room)}가 꽉 찼어요. 설정에서 다른 방을 골라 주세요`); roomCounts();
  } else netRetry();
  netStatus();
}
// back off 1, 2, 4 … 30 s with jitter, so a server restart doesn't bring everyone back in the same instant
function netRetry(){
  if (!net.on) return;
  const s = Math.min(30, 2 ** net.tries++)*(0.5 + Math.random());
  clearTimeout(net.retryTimer); net.retryTimer = setTimeout(netConnect, s*1000);
}
function netNow(){ if (net.on && !net.ws){ net.tries = 0; netConnect(); } else if (net.id){ net.pingT = NET_PING; } }
window.addEventListener('online', netNow);
document.addEventListener('visibilitychange', () => { if (!document.hidden) netNow(); });

function netMessage(raw){
  if (raw === 'pong'){ net.pongBy = 0; netRtt(); return; }
  let m; try { m = JSON.parse(raw); } catch (e) { return; }
  const av = m.id && remoteById(m.id);
  switch (m.t){
    case 'welcome':
      netRtt();
      net.id = m.id; net.tries = 0; net.stateDirty = true; roomCounts();
      (m.players || []).forEach(addRemote);
      if (mode === 'pole') netSend({ t:'pole' });
      break;
    case 'join': addRemote(m.p); break;
    case 'leave': if (av) dropRemote(av); break;
    case 'move': if (av){ remoteMove(av, m); } break;
    case 'state': if (av){ remoteState(av, m); if (EMOTES_OK.has(m.emote)) showEmote(av, m.emote); } break;
    case 'outfit': if (av){ av.outfit = safeLook(m.look); dressAvatar(av); } break;
    case 'name':
      if (m.ok === false) toast('닉네임에 쓸 수 없는 말이 있어서 다른 사람에겐 예전 이름으로 보여요');
      else if (av) av.net.tag.textContent = String(m.name || '').slice(0, 16);
      break;
    case 'chat':
      if (m.ok === false){ hideBubble(me); toast(CHAT_WHY[m.why] || '보내지 못했어요'); }
      else if (av && typeof m.text === 'string') showBubble(av, m.text);
      break;
    // pole lock (the waiting/occupied UI comes with task 4)
    case 'pole': break;
  }
  netStatus();
}

function netRtt(){
  if (!net.pingAt) return;
  const s = (performance.now() - net.pingAt)/1000;
  if (s < 10) net.rtt += (s - net.rtt)*0.3;
  net.pingAt = 0;
}

// send my position a few times a second (only when it changed), my state when it changed, and a ping now and then.
// Along with the position go my velocity and, when walking to a clicked spot, the spot itself,
// so the others can show me where I already am instead of where I was when the message left.
const wrapAng = a => Math.atan2(Math.sin(a), Math.cos(a));
const r3 = v => Math.round(v*1000)/1000;
function netTick(dt){
  if (!net.ws) return;
  net.pingT += dt;
  if (net.pingT >= NET_PING && net.ws.readyState === 1){ net.pingT = 0; net.ws.send('ping'); net.pongBy = clock + NET_PONG; net.pingAt = performance.now(); }
  if (net.pongBy && clock > net.pongBy){ const ws = net.ws; netClosed(ws, 0); try { ws.close(); } catch (e) {} return; }   // no answer: the line is dead
  const h = holder.position;
  if (dt > 0){   // my walking velocity, smoothed over a few frames
    const k = 1 - Math.exp(-15*dt);
    net.vx += ((h.x - net.px)/dt - net.vx)*k; net.vz += ((h.z - net.pz)/dt - net.vz)*k;
  }
  net.px = h.x; net.pz = h.z;
  if (!net.id) return;
  net.sendT += dt; net.stateT += dt;
  const ry = wrapAng(holder.rotation.y), s = net.sent;
  const walking = mode !== 'pole' && Math.hypot(net.vx, net.vz) > 0.3;
  const vx = walking ? net.vx : 0, vz = walking ? net.vz : 0;
  const tgt = mode !== 'pole' && walkTarget ? walkTarget : null;
  // started, stopped, turned or picked a new spot: tell the others right away (moves stay under 15 a second, with state under the server limit of 30)
  const turned = s && (walking !== s.walking || (tgt ? !s.tgt || tgt.distanceTo(s.tgt) > 0.05 : !!s.tgt)
    || (walking && Math.abs(wrapAng(Math.atan2(vx, vz) - Math.atan2(s.vx, s.vz))) > 0.35));
  if (net.sendT >= NET_SEND || (turned && net.sendT >= 0.07)){
    if (!s || turned || Math.hypot(h.x - s.x, h.z - s.z) > 0.01 || Math.abs(wrapAng(ry - s.ry)) > 0.03){
      net.sent = { x:h.x, z:h.z, ry, walking, vx, vz, tgt: tgt && tgt.clone() };
      const m = { t:'move', x:r3(h.x), z:r3(h.z), ry:r3(ry) };
      if (walking){ m.vx = r3(vx); m.vz = r3(vz); }
      if (tgt){ m.tx = r3(tgt.x); m.tz = r3(tgt.z); }
      netSend(m);
    }
    net.sendT = 0;
  }
  if (net.stateDirty && net.stateT >= NET_SEND){
    net.stateT = 0;
    const seat = sitAt && sitAt !== 'ground' ? BENCHES.indexOf(sitAt) : null;
    const m = { t:'state', pose:poseName, sit:seat, face:faceMode, spin:spinPole };
    if (net.emote) m.emote = net.emote;
    netSend(m); net.stateDirty = false; net.emote = null;
  }
}

/* other players: an avatar each, eased toward the last position and state the server sent */
const EMOTES_OK = new Set(['heart', 'note', 'wow', 'sparkle']);
const remoteById = id => others.find(av => av.net && av.net.id === id);
// only draw outfits the wardrobe actually has (anything else falls back to the default piece)
function safeLook(l){
  const o = Object.assign({}, DEFAULT);
  if (l && typeof l === 'object'){
    Object.keys(OPTIONS).forEach(k => { if (OPTIONS[k].some(([v]) => v === l[k])) o[k] = l[k]; });
    Object.keys(COLORS).forEach(k => { if (COLORS[k].some(([v]) => v === l[k])) o[k] = l[k]; });
  }
  return o;
}
function addRemote(p){
  if (!p || !p.id || remoteById(p.id)) return;
  const av = createAvatar(safeLook(p.look), 0.5);
  const tag = document.createElement('div');
  tag.className = 'nameTag'; tag.hidden = true; tag.textContent = String(p.name || '').slice(0, 16);
  document.body.appendChild(tag);
  av.net = { id:p.id, tag, x:0, z:0, ry:0, at:0, vx:0, vz:0, tx:null, tz:null, movedAt:-9, spin:false };
  av.nameShown = showName;
  remoteMove(av, p); av.holder.position.set(av.net.x, 0, av.net.z); av.holder.rotation.y = av.net.ry;
  remoteState(av, p); av.hopAt = av.landAt = -9;
  others.push(av);
}
function dropRemote(av){
  av.net.tag.remove(); if (av.bubble) av.bubble.remove(); removeAvatar(av);
  others.splice(others.indexOf(av), 1);
}
function clearRemotes(){ others.filter(av => av.net).forEach(dropRemote); }
const fin = (v, lim) => typeof v === 'number' && Number.isFinite(v) && Math.abs(v) <= lim;
function remoteMove(av, m){
  const n = av.net;
  if (!fin(m.x, 20) || !fin(m.z, 20)) return;
  if (Math.hypot(m.x - n.x, m.z - n.z) > 0.005) n.movedAt = clock;
  n.x = m.x; n.z = m.z; n.ry = fin(m.ry, 100) ? m.ry : n.ry; n.at = clock;
  n.vx = fin(m.vx, 3) ? m.vx : 0; n.vz = fin(m.vz, 3) ? m.vz : 0;
  n.tx = fin(m.tx, 20) && fin(m.tz, 20) ? m.tx : null; n.tz = m.tz;
}
// where they probably are now: the last reported spot, carried forward along their walk for as long as
// the message took to get here (about half a round trip) plus the time since it arrived
const _goal = new V3();
function remoteGoal(n){
  _goal.set(n.x, 0, n.z);
  const ahead = Math.min(0.6, clock - n.at + net.rtt/2);
  if (n.tx != null){
    const dx = n.tx - n.x, dz = n.tz - n.z, d = Math.hypot(dx, dz);
    if (d > 0.01){ const s = Math.min(d, WALK*ahead)/d; _goal.x += dx*s; _goal.z += dz*s; }
  } else if (n.vx || n.vz){
    _goal.x += n.vx*ahead; _goal.z += n.vz*ahead;
    if (!walkable(_goal.x, _goal.z)) _goal.set(n.x, 0, n.z);   // don't guess them into the lake or a bench
  }
  return _goal;
}
function remoteState(av, m){
  if (POSES[m.pose] && m.pose !== av.pose){
    const onPole = !GROUND_POSES.has(m.pose);
    if (onPole && !av.onPole) av.hopAt = clock;
    if (!onPole && av.onPole) av.landAt = clock;
    av.pose = m.pose; av.onPole = onPole;
  }
  if (FACES.some(([v]) => v === m.face)) av.faceMode = m.face;
  av.net.spin = !!m.spin;
}
function updateRemote(av, dt){
  const n = av.net, h = av.holder.position, g = remoteGoal(n);
  const dx = g.x - h.x, dz = g.z - h.z;
  if (Math.hypot(dx, dz) > 3){ h.x = g.x; h.z = g.z; }   // far off (just joined, came back): no sliding across the park
  else { const k = 1 - Math.exp(-12*dt); h.x += dx*k; h.z += dz*k; }
  av.holder.rotation.y = angLerp(av.holder.rotation.y, n.ry, 1 - Math.exp(-(av.onPole ? 6 : 10)*dt));
  const moving = !av.onPole && av.pose === 'stand' && (clock - n.movedAt < 0.3 || Math.hypot(dx, dz) > 0.05);
  av.moveAmp += ((moving ? 1 : 0) - av.moveAmp)*(1 - Math.exp(-8*dt));
  av.walkPhase += dt*11*av.moveAmp;
  av.spinVel += ((n.spin && av.onPole && av.pose !== 'ready' ? -0.65 : 0) - av.spinVel)*(1 - Math.exp(-2.5*dt));   // only for the skirt flare
}

/* chat: a line typed under the HUD shows as a bubble over the head for a few seconds; the server only relays it */
const CHAT_SHOW = 5;
const CHAT_WHY = { fast:'조금 천천히 보내 주세요 (1초에 한 번)', word:'쓸 수 없는 말이 있어서 보내지 않았어요', link:'링크는 보낼 수 없어요' };
const chatForm = document.getElementById('chatForm'), chatInput = document.getElementById('chatInput'), chatTog = document.getElementById('chatTog');
let chatShown = true, chatLast = 0;
try { chatShown = localStorage.getItem('pole-chat-show') !== '0'; } catch (e) {}
function showBubble(av, text){
  if (!av.bubble){
    av.bubble = document.createElement('div'); av.bubble.className = 'bubble'; av.bubble.hidden = true;
    av.bubble.append(document.createElement('b'), document.createElement('span'));
    document.body.appendChild(av.bubble);
  }
  av.bubble.lastChild.textContent = text; av.bubbleAt = clock;
}
function hideBubble(av){ av.bubbleAt = -99; }
chatForm.addEventListener('submit', e => {
  e.preventDefault();
  const text = chatInput.value.replace(/\s+/g, ' ').trim().slice(0, 60);
  if (!text){ chatInput.blur(); return; }
  if (performance.now() - chatLast < 1000){ toast(CHAT_WHY.fast); return; }
  chatLast = performance.now();
  showBubble(me, text);   // mine shows at once; taken back if the server refuses it
  netSend({ t:'chat', text });
  polkTrack('chat_send', {});
  chatInput.value = '';
});
chatInput.addEventListener('keydown', e => { if (e.key === 'Escape') chatInput.blur(); });
function setChatShown(v){
  chatShown = v; chatTog.setAttribute('aria-pressed', String(v)); chatTog.textContent = v ? '채팅 보기' : '채팅 숨김';
  try { localStorage.setItem('pole-chat-show', v ? '1' : '0'); } catch (e) {}
}
chatTog.addEventListener('click', () => setChatShown(!chatShown));
setChatShown(chatShown);
let toastTimer = 0;
const toastEl = document.getElementById('toast');
function toast(msg){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2800); }

/* ---------- loop ---------- */
let viewW = 0, viewH = 0;
function resize(){
  const w = host.clientWidth || window.innerWidth, h = host.clientHeight || window.innerHeight;
  viewW = w; viewH = h;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.fov = w < 640 ? 55 : 45;
  if (w < 640 && camDist === 3.6) camDist = 4.4;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
// in-app browsers (KakaoTalk, Instagram) often resize the page when their toolbars slide without firing 'resize';
// the canvas then stretches a stale image and everything looks squashed, so also watch the element itself
if (window.ResizeObserver) new ResizeObserver(resize).observe(host);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();
applyOutfit();
updateUI();

let last = performance.now();
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused = false;
function frame(now){
  if (host.clientWidth !== viewW || host.clientHeight !== viewH) resize();   // last-resort size check
  if (paused){ last = now; requestAnimationFrame(frame); return; }
  if (bench) benchTick(now, now - last);
  const dt = Math.min(0.05, Math.max(0, (now - last)/1000)); last = Math.max(last, now);
  update(reduced ? dt*0.6 : dt);
  renderer.render(scene, camera);
  updateNameTag();
  if (perfEl) perfTick(now);
  requestAnimationFrame(frame);
}
for (let i = 0; i < 30; i++) update(1/30);
requestAnimationFrame(frame);

// test hook: jump straight into a pose (used for previews)
window.__poleDebug = {
  pose(name, y, p, d){ queuedMove = name; holder.position.set(0, 0, 0.34); mode = 'approach'; enterPole(); if (y != null){ yaw = y; poseYaw = y; } if (p != null) pitch = p; if (d != null) camDist = d; for (let i = 0; i < 240; i++) update(1/60); renderer.render(scene, camera); },
  pause(v){ paused = v; },
  face(d){ holder.updateMatrixWorld(true); const h = new V3(); skull.getWorldPosition(h); const f = new V3(0,0,1).applyQuaternion(J.head.getWorldQuaternion(new Q())); camera.position.copy(h).addScaledVector(f, d || 0.5); camera.lookAt(h); renderer.render(scene, camera); },
  state(){ holder.updateMatrixWorld(true); const c = new V3(); char.getWorldPosition(c); return { cam: camera.position.toArray(), tgt: camTarget.toArray(), holder: holder.position.toArray(), char: c.toArray(), q: char.quaternion.toArray(), mode, poseName }; },
  ik(){ holder.updateMatrixWorld(true); const pose = POSES[poseName], out = {}; Object.entries(pose.ik || {}).forEach(([n, s]) => { const hand = J[n[0] + (n.endsWith('Arm') ? 'Hand' : 'Foot')], w = new V3(); hand.getWorldPosition(w); out[n] = +w.distanceTo(holder.localToWorld(new V3(...s.t))).toFixed(3); }); const h = new V3(); skull.getWorldPosition(h); out.headGap = +(Math.hypot(h.x - POLE.x, h.z - POLE.z) - HEAD_R*1.06).toFixed(3); return out; },
  look(y, p, d){ yaw = y; pitch = p; camDist = d; for (let i = 0; i < 60; i++) update(1/60); renderer.render(scene, camera); },
  bots(n){ setBots(n); return others.length; },
  net(){ return { id:net.id, room:net.room, open:!!net.ws, players: others.filter(av => av.net).map(av => ({ name:av.net.tag.textContent, x:+av.holder.position.x.toFixed(2), z:+av.holder.position.z.toFixed(2), to:[av.net.x, av.net.z], pose:av.pose, face:av.faceMode, top:av.outfit.top })) }; }
};
})();
</script>
