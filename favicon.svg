<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- pastel sky tile with a strip of lawn -->
  <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#bfe8f8"/>
    <path d="M0 52 Q32 46 64 52 V64 H0Z" fill="#8fd16a"/>
  </g>
  <!-- chrome pole with a pink cap -->
  <rect x="51" y="5" width="4.5" height="56" rx="2" fill="#4b4f57"/>
  <rect x="52.2" y="5" width="1.4" height="56" fill="#c9ced6"/>
  <circle cx="53.25" cy="6" r="3.6" fill="#f6a9bd"/>
  <!-- little hand gripping the pole -->
  <circle cx="50.5" cy="40" r="4" fill="#ffe2d2" stroke="#e8b9a4" stroke-width="0.8"/>
  <!-- head -->
  <ellipse cx="27" cy="34" rx="21" ry="20" fill="#ffe2d2"/>
  <!-- scalloped bob -->
  <path d="M6 37 C4 18 16 9 27 9 C38 9 50 18 48 37 C47 41 45 44 44 46 C44 38 43 31 41 27
           C38 30 35 27 33 29 C31 26 28 29 26 27 C24 30 21 27 19 29 C17 27 15 29 13 28
           C11 32 10 39 10 46 C9 44 7 41 6 37Z" fill="#2b1d16"/>
  <!-- ribbon -->
  <g transform="translate(40 14) rotate(20)">
    <ellipse cx="-5" cy="0" rx="5.5" ry="3.6" fill="#ff8fa8"/>
    <ellipse cx="5" cy="0" rx="5.5" ry="3.6" fill="#ff8fa8"/>
    <circle r="2.4" fill="#f0789a"/>
  </g>
  <!-- eyes -->
  <ellipse cx="20" cy="37" rx="3.4" ry="4.6" fill="#2a1a16"/>
  <ellipse cx="34" cy="37" rx="3.4" ry="4.6" fill="#2a1a16"/>
  <circle cx="21.2" cy="35.2" r="1.4" fill="#fff"/>
  <circle cx="35.2" cy="35.2" r="1.4" fill="#fff"/>
  <!-- cheeks + smile -->
  <ellipse cx="14.5" cy="44" rx="4" ry="2.6" fill="#ff8a9a" opacity="0.6"/>
  <ellipse cx="39.5" cy="44" rx="4" ry="2.6" fill="#ff8a9a" opacity="0.6"/>
  <path d="M24 45 Q27 49 30 45 Z" fill="#9c3a44"/>
</svg>
