<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- sky tile -->
  <rect width="64" height="64" rx="14" fill="#bfe8f8"/>
  <g fill="#3a2a25" stroke="#3a2a25" stroke-linecap="round" stroke-linejoin="round">
    <!-- pole -->
    <rect x="13.4" y="3" width="3.4" height="58" rx="1.7" stroke="none"/>
    <!-- top arm reaching up to a high grip -->
    <path d="M29 21.5 L16.2 8.5" stroke-width="3" fill="none"/>
    <!-- bottom arm bent, gripping at hip height -->
    <path d="M28.6 24.5 Q22.5 28 16.6 34" stroke-width="2.8" fill="none"/>
    <!-- head tipped up toward the top hand, low bun -->
    <circle cx="34.2" cy="15.2" r="5" stroke="none"/>
    <circle cx="39.2" cy="17.4" r="2.7" stroke="none"/>
    <path d="M33.6 19 L32.4 22.5" stroke-width="3.2" fill="none"/>
    <!-- torso -->
    <path d="M27.4 22 Q32.6 20.2 35.6 22.4 Q36.6 27 35.2 30.4 Q37.4 33.4 37.8 36.6 L30.2 37.6 Q29.6 33.6 30.6 30.6 Q27 27 27.4 22Z" stroke-width="1"/>
    <!-- flared skirt -->
    <path d="M29.4 34.6 L38 34 L42.6 41.4 L26 42.4Z" stroke-width="1.4"/>
    <!-- chair legs: knees drawn in toward the pole, shins falling away, tapering to pointed toes -->
    <path d="M31 40.4 L21.6 43.4" stroke-width="5" fill="none"/>
    <path d="M21.6 43.4 L23.4 53" stroke-width="3.4" fill="none"/>
    <path d="M23.4 53 L25.2 59.6" stroke-width="2.1" fill="none"/>
    <path d="M36.2 40.6 L29.4 47.6" stroke-width="4.8" fill="none"/>
    <path d="M29.4 47.6 L36 54.6" stroke-width="3.2" fill="none"/>
    <path d="M36 54.6 L40.8 57.8" stroke-width="2" fill="none"/>
  </g>
</svg>
