<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>야외 폴 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D lakeside scene; frosted panels dock to the edges (wardrobe right, move bar bottom). Single light look, matches the daylight scene. */
:root{
  --ink:#16303a;
  --muted:#58717b;
  --glass:rgba(248,251,252,.8);
  --line:rgba(22,48,58,.12);
  --accent:#b4486b;
  --sky:#cfe5f4;
  --f-display:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene canvas:active{cursor:grabbing}

.brand{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;pointer-events:none;color:#fff;text-shadow:0 2px 22px rgba(24,74,118,.38)}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.6vw,44px);letter-spacing:.24em;margin:0;text-wrap:balance}
.brand p{margin:.5em 0 0;font-size:12px;letter-spacing:.2em}

.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);border:1px solid rgba(255,255,255,.65);box-shadow:0 12px 32px rgba(18,52,72,.16);border-radius:16px}

#wardrobe{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:284px;max-width:calc(100% - 32px);max-height:calc(100% - 190px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px;z-index:5}
.w-head{display:flex;align-items:center;justify-content:space-between}
.w-head h2{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0;letter-spacing:.06em}
.w-sec{display:flex;flex-direction:column;gap:8px}
.w-sec h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);font:500 13px/1 var(--f-body);padding:8px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.swatch{width:26px;height:26px;border-radius:50%;border:1px solid rgba(22,48,58,.22);cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.swatch[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.textbtn{border:0;background:none;color:var(--muted);font:500 13px var(--f-body);cursor:pointer;padding:6px 4px}
#wardrobeBtn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:4;border:0;font:600 13px var(--f-body);color:var(--ink);padding:10px 16px;border-radius:999px;cursor:pointer}

.hud{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:3}
.hud > *{pointer-events:auto}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:#fff;text-shadow:0 1px 8px rgba(10,40,30,.55)}
.status b{font-weight:600}
.tog{border:0;border-radius:999px;font:500 12.5px var(--f-body);padding:7px 12px;cursor:pointer;background:rgba(255,255,255,.82);color:var(--ink);text-shadow:none}
.tog[aria-pressed="true"]{background:var(--accent);color:#fff}
.moves{display:flex;gap:4px;padding:5px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.moves::-webkit-scrollbar{display:none}
.move{flex:0 0 auto;border:0;background:transparent;font:600 13.5px var(--f-body);color:var(--ink);padding:11px 14px;border-radius:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px}
.move small{font:500 10px var(--f-body);color:var(--muted);letter-spacing:.06em}
.move[aria-pressed="true"]{background:var(--ink);color:#fff}
.move[aria-pressed="true"] small{color:rgba(255,255,255,.7)}
.move.leave{color:var(--accent)}
.move:disabled{opacity:.45;cursor:default}
.hint{font-size:12px;color:#fff;text-shadow:0 1px 8px rgba(10,40,30,.6);margin:0;text-align:center}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){
  .brand{top:calc(16px + env(safe-area-inset-top,0px));text-align:left;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .brand h1{letter-spacing:.12em;font-size:24px}
  .brand p{letter-spacing:.1em}
  #wardrobe{max-height:calc(100% - 200px)}
  .hint{display:none}
}
</style>

<div id="scene" aria-label="호숫가 야외 폴 연습장 3D 화면"></div>

<header class="brand">
  <h1>야외 폴 연습장</h1>
  <p>호숫가 스테이지 · 폴 1개 · 혼자 연습</p>
</header>

<button id="wardrobeBtn" class="glass" type="button" aria-controls="wardrobe" aria-expanded="false">옷장 열기</button>

<aside id="wardrobe" class="glass" aria-label="옷장">
  <div class="w-head"><h2>옷장</h2><button id="wardrobeClose" class="textbtn" type="button">닫기</button></div>
  <div class="w-sec"><h3>상의</h3><div class="chips" data-key="top"></div><div class="sw" data-key="topColor"></div></div>
  <div class="w-sec"><h3>하의</h3><div class="chips" data-key="bottom"></div><div class="sw" data-key="bottomColor"></div></div>
  <div class="w-sec"><h3>신발</h3><div class="chips" data-key="shoes"></div></div>
  <div class="w-sec"><h3>헤어</h3><div class="chips" data-key="hair"></div><div class="sw" data-key="hairColor"></div></div>
  <div class="w-sec"><h3>눈동자</h3><div class="sw" data-key="eyeColor"></div></div>
  <div class="w-sec"><h3>피부 톤</h3><div class="sw" data-key="skin"></div></div>
</aside>

<div class="hud">
  <div class="status">
    <span>지금: <b id="statusText">자유 이동</b></span>
    <button id="spinTog" class="tog" type="button" aria-pressed="false">스핀 폴</button>
    <button id="camTog" class="tog" type="button" aria-pressed="false">전체 보기</button>
  </div>
  <nav class="moves glass" id="moves" aria-label="폴 동작"></nav>
  <p class="hint">바닥 클릭 또는 WASD로 이동 · 드래그로 시점 회전 · 휠로 확대 · 숫자키 1–5 동작</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const T = THREE;
const V3 = T.Vector3, Q = T.Quaternion;
const col = h => new T.Color(h).convertSRGBToLinear();
const PI = Math.PI;

/* ---------- renderer / scene ---------- */
const host = document.getElementById('scene');
const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new T.Scene();
const FOG = 0xcfe3ef;
scene.fog = new T.Fog(col(FOG), 70, 340);
const camera = new T.PerspectiveCamera(45, 1, 0.05, 1200);

/* ---------- helpers ---------- */
let seed = 11;
function rnd(){ seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function hash(x, z){ const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z){ const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi; const u = xf*xf*(3-2*xf), v = zf*zf*(3-2*zf); const a = hash(xi,zi), b = hash(xi+1,zi), c = hash(xi,zi+1), d = hash(xi+1,zi+1); return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v; }

/* ---------- sky ---------- */
const skyGeo = new T.SphereGeometry(600, 32, 16);
const skyMat = new T.ShaderMaterial({
  uniforms: { top:{value:new T.Color(0x1d6ccf)}, mid:{value:new T.Color(0x56a3ea)}, low:{value:new T.Color(0xd6ebf8)}, ground:{value:new T.Color(0x5b7d45)} },
  vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }',
  fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 low; uniform vec3 ground; varying vec3 vW; void main(){ float h = normalize(vW - cameraPosition).y; vec3 c = mix(low, mid, smoothstep(0.0,0.22,h)); c = mix(c, top, smoothstep(0.22,0.95,h)); c = mix(c, ground, smoothstep(0.0,-0.12,h)); gl_FragColor = vec4(c,1.0); }',
  side: T.BackSide, depthWrite: false, fog: false
});
const sky = new T.Mesh(skyGeo, skyMat); sky.renderOrder = -1; scene.add(sky);
const pmrem = new T.PMREMGenerator(renderer);
const envScene = new T.Scene(); envScene.add(new T.Mesh(skyGeo, skyMat));
scene.environment = pmrem.fromScene(envScene, 0.03).texture;

/* ---------- lights ---------- */
scene.add(new T.HemisphereLight(col(0xcfe6ff), col(0x5a7a3e), 0.5));
const sun = new T.DirectionalLight(col(0xfff2df), 2.3);
sun.position.set(12, 20, 13);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-11, right:11, top:11, bottom:-11, near:1, far:60 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun); scene.add(sun.target);

/* ---------- lake ---------- */
const LAKE = { x:0, z:-21, rx:38, rz:13 };
const lakeR = a => 1 + 0.06*Math.sin(a*5.0) + 0.04*Math.sin(a*11 + 1.3);
function inLake(x, z, m = 0){ const dx = x - LAKE.x, dz = z - LAKE.z; const a = Math.atan2(dz / LAKE.rz, dx / LAKE.rx); const f = lakeR(a); return (dx*dx)/((LAKE.rx*f+m)**2) + (dz*dz)/((LAKE.rz*f+m)**2) < 1; }

/* ---------- ground ---------- */
{
  const g = new T.PlaneGeometry(700, 700, 160, 160); g.rotateX(-PI/2);
  const pos = g.attributes.position, cols = [];
  const a = col(0x5f9440), b = col(0x7fae4f), c = col(0x46783a), mud = col(0x7a7754), tmp = new T.Color();
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const n = vnoise(x*0.08, z*0.08)*0.6 + vnoise(x*0.3, z*0.3)*0.4;
    tmp.copy(a).lerp(b, n); tmp.lerp(c, Math.max(0, vnoise(x*0.03+9, z*0.03)-0.55)*1.6);
    if (inLake(x, z, 1.6) && !inLake(x, z, 0)) tmp.lerp(mud, 0.55);
    cols.push(tmp.r, tmp.g, tmp.b);
  }
  g.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
  const ground = new T.Mesh(g, new T.MeshStandardMaterial({ vertexColors:true, roughness:1, envMapIntensity:0.5 }));
  ground.receiveShadow = true; scene.add(ground);
}
const waterUniforms = {
  t:{value:0}, deep:{value:new T.Color(0x3f6b5a)}, shallow:{value:new T.Color(0x7aa08a)},
  skyC:{value:new T.Color(0x6fb0ea)}, horizon:{value:new T.Color(0xdcecf6)}, treeC:{value:new T.Color(0x2f5233)},
  fogC:{value:new T.Color(FOG)}, sunDir:{value:new V3(12,20,13).normalize()}
};
{
  const shape = new T.Shape();
  for (let i = 0; i <= 160; i++){
    const a = i/160*PI*2, f = lakeR(a);
    const x = LAKE.x + Math.cos(a)*LAKE.rx*f, z = LAKE.z + Math.sin(a)*LAKE.rz*f;
    i ? shape.lineTo(x, -z) : shape.moveTo(x, -z);
  }
  const g = new T.ShapeGeometry(shape, 64); g.rotateX(-PI/2);
  const mat = new T.ShaderMaterial({
    uniforms: waterUniforms, fog:false,
    vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }',
    fragmentShader: `
      uniform float t; uniform vec3 deep; uniform vec3 shallow; uniform vec3 skyC; uniform vec3 horizon; uniform vec3 treeC; uniform vec3 fogC; uniform vec3 sunDir;
      varying vec3 vW;
      void main(){
        vec2 p = vW.xz;
        vec3 n = normalize(vec3(
          0.05*cos(p.x*0.9+t*0.8) + 0.04*cos((p.x+p.y)*2.7+t*1.7) + 0.03*cos((p.x-p.y)*4.1-t*1.3) + 0.015*cos(p.x*9.0+t*2.6),
          1.0,
          0.06*cos(p.y*1.3-t*0.6) + 0.04*cos((p.x+p.y)*2.7+t*1.7) - 0.03*cos((p.x-p.y)*4.1-t*1.3) + 0.015*cos(p.y*8.0-t*2.2)));
        vec3 v = normalize(cameraPosition - vW);
        float fres = pow(1.0 - max(dot(n, v), 0.0), 3.0);
        vec3 r = reflect(-v, n);
        vec3 refl = mix(horizon, skyC, smoothstep(0.0, 0.45, r.y));
        refl = mix(refl, treeC, smoothstep(-24.0, -32.0, p.y) * 0.75);
        vec3 c = mix(mix(shallow, deep, 0.6), refl, 0.3 + 0.6*fres);
        float spec = pow(max(dot(r, sunDir), 0.0), 160.0);
        c += vec3(1.0, 0.97, 0.9) * spec * 0.9;
        float d = length(vW - cameraPosition);
        c = mix(c, fogC, smoothstep(70.0, 340.0, d));
        gl_FragColor = vec4(c, 1.0);
      }`
  });
  const water = new T.Mesh(g, mat); water.position.y = 0.035; scene.add(water);
}
/* reeds */
{
  const geo = new T.ConeGeometry(0.018, 1, 4); geo.translate(0, 0.5, 0);
  const reeds = new T.InstancedMesh(geo, new T.MeshStandardMaterial({ color:col(0x4d6f2c), roughness:0.9 }), 900);
  const m = new T.Matrix4(), q = new Q(), s = new V3(), p = new V3(), e = new T.Euler(), c = new T.Color();
  let n = 0;
  while (n < 900){
    const a = rnd()*PI*2, f = lakeR(a), k = 1.0 + (rnd()*0.08 - 0.02);
    const x = LAKE.x + Math.cos(a)*LAKE.rx*f*k, z = LAKE.z + Math.sin(a)*LAKE.rz*f*k;
    if (Math.sin(a) < 0.1 && rnd() < 0.6) continue;
    if (vnoise(x*0.25, z*0.25) < 0.42) continue;
    p.set(x, 0, z); e.set((rnd()-0.5)*0.3, rnd()*6, (rnd()-0.5)*0.3); q.setFromEuler(e);
    s.set(1, 0.5 + rnd()*0.9, 1);
    reeds.setMatrixAt(n, m.compose(p, q, s));
    reeds.setColorAt(n, c.copy(col(0x4d6f2c)).lerp(col(0x9aa85a), rnd()*0.6));
    n++;
  }
  scene.add(reeds);
}
/* grass + flowers */
{
  const geo = new T.ConeGeometry(0.022, 0.24, 3); geo.translate(0, 0.12, 0);
  const COUNT = 9000;
  const grass = new T.InstancedMesh(geo, new T.MeshStandardMaterial({ roughness:0.95, envMapIntensity:0.4 }), COUNT);
  const FC = 420;
  const flowers = new T.InstancedMesh(new T.SphereGeometry(0.03, 6, 4), new T.MeshStandardMaterial({ roughness:0.7 }), FC);
  const m = new T.Matrix4(), q = new Q(), s = new V3(), p = new V3(), e = new T.Euler(), c = new T.Color();
  let n = 0, fn = 0;
  while (n < COUNT){
    const r = Math.sqrt(rnd())*17, a = rnd()*PI*2;
    const x = Math.cos(a)*r, z = Math.sin(a)*r + 1;
    if (Math.hypot(x, z) < 1.5 || inLake(x, z, 0.4)) continue;
    p.set(x, 0, z); e.set((rnd()-0.5)*0.5, rnd()*6, (rnd()-0.5)*0.5); q.setFromEuler(e);
    s.set(1, 0.6 + rnd()*0.9, 1);
    grass.setMatrixAt(n, m.compose(p, q, s));
    grass.setColorAt(n, c.copy(col(0x4f8a35)).lerp(col(0xa9c95f), rnd()*0.7));
    n++;
    if (fn < FC && rnd() < 0.05){
      p.y = 0.16 + rnd()*0.08; s.set(1,1,1);
      flowers.setMatrixAt(fn, m.compose(p, q.identity(), s));
      flowers.setColorAt(fn, col(rnd() < 0.7 ? 0xfafaf2 : 0xf3d34a));
      fn++;
    }
  }
  flowers.count = fn;
  grass.receiveShadow = true; scene.add(grass, flowers);
}
/* trees */
const trunkGeo = new T.CylinderGeometry(0.1, 0.17, 1, 7); trunkGeo.translate(0, 0.5, 0);
const leafGeo = new T.IcosahedronGeometry(1, 1);
const trunkMat = new T.MeshStandardMaterial({ color:col(0x5a4433), roughness:1 });
const leafMats = [0x3c7531, 0x4c8838, 0x5d9842, 0x2e6430, 0x6aa24a].map(h => new T.MeshStandardMaterial({ color:col(h), roughness:0.95, flatShading:true, envMapIntensity:0.5 }));
function tree(x, z, s, shadow){
  const g = new T.Group();
  const trunk = new T.Mesh(trunkGeo, trunkMat); trunk.scale.set(s, 2.4*s, s); g.add(trunk);
  const blobs = 3 + Math.floor(rnd()*3);
  for (let i = 0; i < blobs; i++){
    const l = new T.Mesh(leafGeo, leafMats[Math.floor(rnd()*leafMats.length)]);
    const r = (1.0 + rnd()*0.7)*s;
    l.scale.set(r, r*(0.8 + rnd()*0.3), r);
    l.position.set((rnd()-0.5)*1.6*s, (2.5 + rnd()*1.6)*s, (rnd()-0.5)*1.6*s);
    l.rotation.y = rnd()*6;
    g.add(l);
  }
  g.position.set(x, 0, z);
  g.traverse(o => { if (o.isMesh){ o.castShadow = shadow; o.receiveShadow = shadow; } });
  scene.add(g);
}
for (let i = 0; i < 46; i++){
  const side = i % 2 ? 1 : -1;
  const x = side*(10 + rnd()*20), z = -7 + rnd()*24;
  if (inLake(x, z, 2)) continue;
  tree(x, z, 1.0 + rnd()*0.9, Math.hypot(x, z) < 18);
}
for (let i = 0; i < 24; i++){ tree((rnd()-0.5)*70, 18 + rnd()*25, 1 + rnd()*0.8, false); }
for (let i = 0; i < 150; i++){
  const x = (rnd()-0.5)*150, z = -36 - rnd()*22;
  if (inLake(x, z, 1.5)) continue;
  tree(x, z, 1.3 + rnd()*1.3, false);
}
/* hills & mountains */
{
  const hillMat = new T.MeshStandardMaterial({ color:col(0x4c7a42), roughness:1, flatShading:true });
  [[-60,-78,40,9],[10,-85,46,12],[75,-80,38,10],[-120,-70,34,8]].forEach(([x,z,r,h]) => {
    const m = new T.Mesh(new T.SphereGeometry(1, 24, 12, 0, PI*2, 0, PI/2), hillMat);
    m.scale.set(r, h, r*0.55); m.position.set(x, -0.2, z); scene.add(m);
  });
  const mtMat = new T.MeshStandardMaterial({ color:col(0x5f8c80), roughness:1, flatShading:true, envMapIntensity:0.6 });
  [[-130,-175,95,58],[-25,-205,120,74],[95,-185,95,52],[185,-150,75,40],[-210,-140,70,36]].forEach(([x,z,r,h]) => {
    const g = new T.ConeGeometry(r, h, 30, 8);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++){
      const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
      const k = 1 + (vnoise(vx*0.05 + x, vz*0.05) - 0.5)*0.45;
      p.setXYZ(i, vx*k, vy + (vnoise(vx*0.08, vz*0.08) - 0.5)*h*0.15*(1 - (vy/h + 0.5)), vz*k);
    }
    g.computeVertexNormals();
    const m = new T.Mesh(g, mtMat); m.position.set(x, h/2 - 2, z); scene.add(m);
  });
}
/* clouds */

})();
const TOON_K = 0.37; // toon colors are pre-darkened so full sunlight lands near the swatch color
const tcol = h => col(h).multiplyScalar(TOON_K);
const toon = (h, o = {}) => new T.MeshToonMaterial(Object.assign({ color:tcol(h), gradientMap:grad, side:T.DoubleSide, toneMapped:false }, o));

// lace pattern for the lace pieces
const laceTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, 256, 256);
  x.strokeStyle = 'rgba(120,100,80,.2)'; x.lineWidth = 3;
  for (let row = 0; row < 4; row++) for (let i = 0; i < 4; i++){
    const cx = i*64 + (row % 2 ? 32 : 0) + 32, cy = row*64 + 32;
    for (let p = 0; p < 5; p++){
      const a = p/5*PI*2;
      x.beginPath(); x.ellipse(cx + Math.cos(a)*11, cy + Math.sin(a)*11, 9, 6, a, 0, PI*2); x.stroke();
    }
    x.beginPath(); x.arc(cx, cy, 4, 0, PI*2); x.fillStyle = 'rgba(120,100,80,.18)'; x.fill();
    x.beginPath(); x.arc(cx + 32, cy + 32, 22, 0, PI*2); x.stroke();
  }
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(5, 2); t.encoding = T.sRGBEncoding;
  return t;
})();

function mesh(geo, mat){ const m = new T.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m; }
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };
// profile: [[radius, y], ...] with y increasing
function lathe(profile, mat, sx = 1, sz = 1, off = 0, seg = 32){
  const g = new T.LatheGeometry(profile.map(([r, y]) => new T.Vector2(r + off, y)), seg);
  const m = mesh(g, mat); m.scale.set(sx, 1, sz); return m;
}
function sub(profile, y0, y1){
  const lerpR = y => { for (let i = 0; i < profile.length - 1; i++){ const [r0, a] = profile[i], [r1, b] = profile[i+1]; if (y >= a && y <= b) return r0 + (r1 - r0)*(y - a)/(b - a); } return y < profile[0][1] ? profile[0][0] : profile[profile.length-1][0]; };
  const out = [[lerpR(y0), y0]];
  profile.forEach(([r, y]) => { if (y > y0 && y < y1) out.push([r, y]); });
  out.push([lerpR(y1), y1]);
  return out;
}
function ell(r, sx, sy, sz, mat, th0 = 0, thL = PI, ph0 = 0, phL = PI*2, seg = 28){
  const m = mesh(new T.SphereGeometry(r, seg, Math.max(10, seg*0.6|0), ph0, phL, th0, thL), mat); m.scale.set(sx, sy, sz); return m;
}
function tube(points, r, mat){
  return mesh(new T.TubeGeometry(new T.CatmullRomCurve3(points.map(p => new V3(...p))), 20, r, 6, false), mat);
}
// a tapered, flattened hair strand hanging along -Y from its root
function strandGeo(len, w, thick){
  const g = new T.ConeGeometry(w, len, 8, 4, false);
  g.rotateX(PI); g.translate(0, -len/2, 0); g.scale(1, 1, thick);
  // gentle curve forward toward the tip
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++){ const y = p.getY(i); const t = -y/len; p.setZ(i, p.getZ(i) + t*t*w*0.9); }
  g.computeVertexNormals();
  return g;
}

function piece(key, obj, parent){ parent.add(obj); (P[key] = P[key] || []).push(obj); return obj; }

// one smooth head shape: a sphere whose lower half narrows into an anime chin
function chinify(geo, r){
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++){
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const t = Math.min(1, Math.max(0, -y / r)), t2 = t*t;
    x *= 1 - 0.34*t2;
    z = z*(1 - 0.1*t2) + 0.028*t2*Math.max(z, 0)/r;
    y *= 1 + 0.16*t;
    p.setXYZ(i, x, y, z);
  }
  geo.computeVertexNormals();
  return geo;
}

function shade(hex, k){ const c = new T.Color(hex); return '#' + c.multiplyScalar(k).getHexString(); }
function mixHex(a, b, t){ return '#' + new T.Color(a).lerp(new T.Color(b), t).getHexString(); }
function drawFace(cv, open, eye, hair){
  const x = cv.getContext('2d');
  x.clearRect(0, 0, FACE_W, FACE_H);
  const lash = shade(hair, 0.55) === '#000000' ? '#1d1412' : mixHex('#1d1412', hair, 0.25);
  // blush
  [[196, 392], [572, 392]].forEach(([bx, by]) => {
    const g = x.createRadialGradient(bx, by, 4, bx, by, 78);
    g.addColorStop(0, 'rgba(255,130,140,.32)'); g.addColorStop(1, 'rgba(255,130,140,0)');
    x.fillStyle = g; x.beginPath(); x.ellipse(bx, by, 84, 52, 0, 0, PI*2); x.fill();
  });
  // brows
  x.strokeStyle = mixHex(hair, '#3a2620', 0.35); x.lineCap = 'round'; x.lineWidth = 7;
  [[215, -1], [553, 1]].forEach(([cx, f]) => {
    x.beginPath(); x.moveTo(cx - f*58, 158); x.quadraticCurveTo(cx - f*5, 138, cx + f*52, 150); x.stroke();
  });
  // nose shade + mouth
  x.strokeStyle = 'rgba(205,130,120,.75)'; x.lineWidth = 4;
  x.beginPath(); x.moveTo(390, 372); x.lineTo(384, 398); x.stroke();
  x.strokeStyle = '#c4646a'; x.lineWidth = 5;
  x.beginPath(); x.moveTo(358, 452); x.quadraticCurveTo(384, 470, 410, 450); x.stroke();
  x.fillStyle = 'rgba(232,140,145,.55)';
  x.beginPath(); x.moveTo(370, 459); x.quadraticCurveTo(384, 474, 398, 459); x.quadraticCurveTo(384, 466, 370, 459); x.fill();

  [[215, -1], [553, 1]].forEach(([cx, f]) => {
    const cy = 288;
    if (!open){
      x.strokeStyle = lash; x.lineWidth = 9;
      x.beginPath(); x.moveTo(cx + f*62, cy + 2); x.quadraticCurveTo(cx, cy + 34, cx - f*58, cy + 8); x.stroke();
      x.lineWidth = 5; x.beginPath(); x.moveTo(cx + f*62, cy + 2); x.lineTo(cx + f*78, cy - 10); x.stroke();
      return;
    }
    // eye opening shape
    const lid = () => { x.beginPath(); x.moveTo(cx + f*64, cy - 4); x.quadraticCurveTo(cx + f*10, cy - 88, cx - f*60, cy - 34); x.quadraticCurveTo(cx - f*66, cy + 30, cx - f*38, cy + 62); x.quadraticCurveTo(cx + f*24, cy + 82, cx + f*64, cy - 4); x.closePath(); };
    x.save(); lid(); x.clip();
    x.fillStyle = '#fbfbff'; x.fillRect(cx - 80, cy - 100, 160, 200);
    // iris
    const ix = cx - f*2, iy = cy + 10;
    const ig = x.createLinearGradient(0, iy - 64, 0, iy + 64);
    ig.addColorStop(0, shade(eye, 0.35)); ig.addColorStop(0.45, eye); ig.addColorStop(1, mixHex(eye, '#ffffff', 0.55));
    x.fillStyle = ig; x.beginPath(); x.ellipse(ix, iy, 45, 62, 0, 0, PI*2); x.fill();
    x.strokeStyle = shade(eye, 0.3); x.lineWidth = 4; x.stroke();
    x.fillStyle = shade(eye, 0.22); x.beginPath(); x.ellipse(ix, iy + 2, 21, 30, 0, 0, PI*2); x.fill();
    // shadow from the upper lid
    const sg = x.createLinearGradient(0, cy - 70, 0, cy - 10);
    sg.addColorStop(0, 'rgba(60,30,30,.45)'); sg.addColorStop(1, 'rgba(60,30,30,0)');
    x.fillStyle = sg; x.fillRect(cx - 80, cy - 100, 160, 90);
    // highlights
    x.fillStyle = '#ffffff';
    x.beginPath(); x.ellipse(ix + f*14, iy - 26, 13, 17, f*0.4, 0, PI*2); x.fill();
    x.beginPath(); x.arc(ix - f*18, iy + 30, 7, 0, PI*2); x.fill();
    x.globalAlpha = 0.5; x.beginPath(); x.ellipse(ix, iy + 40, 26, 9, 0, 0, PI*2); x.fill(); x.globalAlpha = 1;
    x.restore();
    // upper lash line with outer flick
    x.strokeStyle = lash; x.lineCap = 'round'; x.lineJoin = 'round';
    x.lineWidth = 11;
    x.beginPath(); x.moveTo(cx - f*60, cy - 30); x.quadraticCurveTo(cx + f*10, cy - 86, cx + f*66, cy - 4); x.stroke();
    x.lineWidth = 7;
    x.beginPath(); x.moveTo(cx + f*58, cy - 18); x.lineTo(cx + f*84, cy - 32); x.stroke();
    x.beginPath(); x.moveTo(cx + f*64, cy - 4); x.lineTo(cx + f*82, cy - 8); x.stroke();
    // crease + lower lash
    x.lineWidth = 3; x.strokeStyle = 'rgba(120,70,60,.55)';
    x.beginPath(); x.moveTo(cx - f*40, cy - 70); x.quadraticCurveTo(cx + f*14, cy - 104, cx + f*58, cy - 40); x.stroke();
    x.lineWidth = 3; x.strokeStyle = lash;
    x.beginPath(); x.moveTo(cx + f*56, cy + 14); x.quadraticCurveTo(cx + f*24, cy + 72, cx - f*20, cy + 74); x.stroke();
  });
}

const MOVE_ORDER = ['chair','figurehead','hera','brass','ayesha'];
const JOINTS = ['spine','chest','neck','head','lUp','lFore','lHand','rUp','rFore','rHand','lThigh','lShin','lFoot','rThigh','rShin','rFoot'];
const LIMBS = {
  lArm:{ a:'lUp', b:'lFore', L1:0.27, L2:0.285, arm:true },
  rArm:{ a:'rUp', b:'rFore', L1:0.27, L2:0.285, arm:true },
  lLeg:{ a:'lThigh', b:'lShin', L1:0.43, L2:0.42, arm:false },
  rLeg:{ a:'rThigh', b:'rShin', L1:0.43, L2:0.42, arm:false },
};
// precompute root quaternions
const _m4 = new T.Matrix4();
Object.values(POSES).forEach(p => {
  if (p.up){
    const y = new V3(...p.up).normalize();
    const z = new V3(...p.fwd); z.addScaledVector(y, -z.dot(y)).normalize();
    const x = new V3().crossVectors(y, z).normalize();
    p.q = new Q().setFromRotationMatrix(_m4.makeBasis(x, y, z));
  } else p.q = new Q().setFromEuler(new T.Euler(...p.r));
  p.ikSkip = new Set();
  Object.keys(p.ik || {}).forEach(k => { p.ikSkip.add(LIMBS[k].a); p.ikSkip.add(LIMBS[k].b); });
});

/* ---------- two-bone IK ---------- */
const _S = new V3(), _Tt = new V3(), _H = new V3(), _E = new V3(), _d = new V3(), _b = new V3(), _HZ = new V3();
const _bx = new V3(), _by = new V3(), _bz = new V3(), _bm = new T.Matrix4();
const _qa = new Q(), _qb = new Q(), _qp = new Q(), _ql = new Q(), _dirA = new V3(), _dirB = new V3(), _Tc = new V3();
function boneQuat(dir, hz, out){
  _by.copy(dir).negate();
  _bz.copy(hz).addScaledVector(_by, -hz.dot(_by));
  if (_bz.lengthSq() < 1e-6){ _bz.set(0, 0, 1).addScaledVector(_by, -_by.z); }
  _bz.normalize();
  _bx.crossVectors(_by, _bz).normalize();
  _bz.crossVectors(_bx, _by);
  return out.setFromRotationMatrix(_bm.makeBasis(_bx, _by, _bz));
}
function solveIK(limb, spec, k){
  const A = J[limb.a], B = J[limb.b];
  _Tt.set(...spec.t); holder.localToWorld(_Tt);
  _H.set(...spec.h).normalize().applyQuaternion(holder.quaternion);
  A.getWorldPosition(_S);
  _d.subVectors(_Tt, _S);
  let dist = _d.length(); _d.normalize();
  const L1 = limb.L1, L2 = limb.L2;
  dist = Math.min(L1 + L2 - 0.002, Math.max(Math.abs(L1 - L2) + 0.01, dist));
  const cosA = (L1*L1 + dist*dist - L2*L2) / (2*L1*dist);
  const sinA = Math.sqrt(Math.max(0, 1 - cosA*cosA));
  _b.copy(_H).addScaledVector(_d, -_H.dot(_d));
  if (_b.lengthSq() < 1e-6) _b.set(0, 1, 0).addScaledVector(_d, -_d.y);
  _b.normalize();
  _E.copy(_S).addScaledVector(_d, cosA*L1).addScaledVector(_b, sinA*L1);
  _Tc.copy(_S).addScaledVector(_d, dist);
  _HZ.copy(_H); if (limb.arm) _HZ.negate();
  _dirA.subVectors(_E, _S).normalize();
  boneQuat(_dirA, _HZ, _qa);
  A.parent.getWorldQuaternion(_qp);
  _ql.copy(_qp).invert().multiply(_qa);
  A.quaternion.slerp(_ql, k);
  _dirB.subVectors(_Tc, _E).normalize();
  boneQuat(_dirB, _HZ, _qb);
  _ql.copy(_qa).invert().multiply(_qb);
  B.quaternion.slerp(_ql, k);
}

/* ---------- state ---------- */
let mode = 'roam';          // roam | approach | pole
let poseName = 'stand';
let poseStart = 0, poseYaw = 0;
let walkTarget = null, queuedMove = null, pendingLeave = null;
let spinVel = 0, spinPole = false, moveAmp = 0, walkPhase = 0, clock = 0, blinkAt = 3, blinking = 0;
const keys = {};

holder.position.set(0.9, 0, 1.6); holder.rotation.y = 0.35;
char.position.set(0, 0.958, 0);

const _q = new Q(), _q2 = new Q(), _q3 = new Q(), _v = new V3(), _e = new T.Euler(), DOWN = new V3(0, -1, 0);
const tmpWP = new V3(), tmpWQ = new Q();

function rebase(pos, rotY){
  holder.updateMatrixWorld(true);
  char.getWorldPosition(tmpWP); char.getWorldQuaternion(tmpWQ);
  holder.position.copy(pos); holder.rotation.set(0, rotY, 0); holder.updateMatrixWorld(true);
  const inv = holder.quaternion.clone().invert();
  char.position.copy(tmpWP.sub(holder.position).applyQuaternion(inv));
  char.quaternion.copy(inv.multiply(tmpWQ));
}
function setPose(name){ poseName = name; poseStart = clock; poseYaw = yaw; updateUI(); }
function startMove(name){
  if (mode === 'pole'){ pendingLeave = null; setPose(name); return; }
  const wp = holder.position;
  const a = Math.atan2(wp.x - POLE.x, wp.z - POLE.z);
  walkTarget = new V3(POLE.x + Math.sin(a)*0.34, 0, POLE.z + Math.cos(a)*0.34);
  queuedMove = name; mode = 'approach'; updateUI();
}
function enterPole(){
  const a = Math.atan2(holder.position.x - POLE.x, holder.position.z - POLE.z);
  rebase(POLE.clone(), a + PI);
  mode = 'pole'; walkTarget = null;
  setPose(queuedMove || 'ready'); queuedMove = null;
}
function requestLeave(target){
  if (mode !== 'pole') return;
  pendingLeave = { target: target || null };
  if (poseName !== 'ready') setPose('ready'); else poseStart = clock - 3;
}
function doLeave(){
  holder.updateMatrixWorld(true);
  char.getWorldPosition(_v);
  const fwd = new V3(0, 0, 1).applyQuaternion(char.getWorldQuaternion(_q));
  rebase(new V3(_v.x, 0, _v.z), Math.atan2(fwd.x, fwd.z));
  mode = 'roam'; walkTarget = pendingLeave && pendingLeave.target; pendingLeave = null;
  spinVel = 0; setPose('stand');
}
function goTo(p){
  if (mode === 'pole'){ requestLeave(p); return; }
  mode = 'roam'; queuedMove = null; walkTarget = p; updateUI();
}
const walkable = (x, z) => Math.hypot(x, z - 1) < 8.5 && !inLake(x, z, 0.8);

/* ---------- camera orbit ---------- */
let yaw = 0.05, pitch = 0.1, camDist = 5.2, wide = false;
const camTarget = new V3(0, 1.2, 0);
function updateCamera(dt){
  holder.updateMatrixWorld(true);
  char.getWorldPosition(_v);
  const goal = wide ? new V3(_v.x*0.4, 1.8, _v.z*0.4) : new V3(_v.x, Math.max(1.0, _v.y + 0.2), _v.z);
  camTarget.lerp(goal, 1 - Math.exp(-4*dt));
  const d = wide ? Math.max(camDist, 8) : camDist;
  camera.position.set(
    camTarget.x + Math.sin(yaw)*Math.cos(pitch)*d,
    Math.max(0.25, camTarget.y + Math.sin(pitch)*d),
    camTarget.z + Math.cos(yaw)*Math.cos(pitch)*d);
  camera.lookAt(camTarget);
  sky.position.copy(camera.position);
}

/* ---------- per-frame ---------- */
function angLerp(a, b, t){ let d = b - a; d = Math.atan2(Math.sin(d), Math.cos(d)); return a + d*t; }
function update(dt){
  clock += dt;
  waterUniforms.t.value = clock;
  clouds.forEach(c => { c.position.x += c.userData.v*dt; if (c.position.x > 220) c.position.x = -220; });
  if (marker.material.opacity > 0){ marker.material.opacity = Math.max(0, marker.material.opacity - dt*0.8); marker.scale.setScalar(1 + (1 - marker.material.opacity)*0.6); }

  // blink
  if (clock > blinkAt){ blinking = 0.13; blinkAt = clock + 2.5 + Math.random()*3; }
  if (blinking > 0){ blinking -= dt; faceM.map = faceTex[blinking > 0 ? 1 : 0]; }

  let f = 0, s = 0;
  if (keys.w || keys.arrowup) f += 1; if (keys.s || keys.arrowdown) f -= 1;
  if (keys.d || keys.arrowright) s += 1; if (keys.a || keys.arrowleft) s -= 1;
  let keyDir = null;
  if (f || s){
    keyDir = new V3(-Math.sin(yaw)*f + Math.cos(yaw)*s, 0, -Math.cos(yaw)*f - Math.sin(yaw)*s).normalize();
    if (mode === 'pole'){ if (!pendingLeave) requestLeave(null); keyDir = null; }
    else if (mode === 'approach'){ mode = 'roam'; queuedMove = null; walkTarget = null; updateUI(); }
  }
  if (mode === 'pole' && pendingLeave && poseName === 'ready' && clock - poseStart > 1.3) doLeave();

  let moving = false;
  if (mode === 'roam' || mode === 'approach'){
    let dir = null, dist = Infinity;
    if (keyDir){ dir = keyDir; walkTarget = null; }
    else if (walkTarget){
      _v.set(walkTarget.x - holder.position.x, 0, walkTarget.z - holder.position.z);
      dist = _v.length();
      if (dist < (mode === 'approach' ? 0.03 : 0.06)){ walkTarget = null; if (mode === 'approach') enterPole(); }
      else dir = _v.normalize().clone();
    }
    if (dir && mode !== 'pole'){
      const step = Math.min(1.6*dt, dist);
      const nx = holder.position.x + dir.x*step, nz = holder.position.z + dir.z*step;
      const nearPole = Math.hypot(nx - POLE.x, nz - POLE.z) < (mode === 'approach' ? 0.3 : 0.4);
      if (walkable(nx, nz) && !nearPole){ holder.position.x = nx; holder.position.z = nz; moving = true; }
      else if (mode === 'approach' && nearPole){ enterPole(); }
      else { walkTarget = null; }
      if (mode !== 'pole') holder.rotation.y = angLerp(holder.rotation.y, Math.atan2(dir.x, dir.z), 1 - Math.exp(-10*dt));
    }
  }
  moveAmp += ((moving ? 1 : 0) - moveAmp)*(1 - Math.exp(-8*dt));
  walkPhase += dt*8.5*moveAmp;

  const pose = POSES[poseName];
  if (mode === 'pole'){
    if (spinPole && poseName !== 'ready'){
      spinVel += (-0.65 - spinVel)*(1 - Math.exp(-2.5*dt));
      holder.rotation.y += spinVel*dt;
    } else {
      spinVel *= Math.exp(-3*dt);
      holder.rotation.y += spinVel*dt;
      if (pose.view != null) holder.rotation.y = angLerp(holder.rotation.y, poseYaw - pose.view, 1 - Math.exp(-1.6*dt));
    }
  }

  // blend root toward the pose
  const lift = outfit.shoes === 'heels' && (poseName === 'stand' || poseName === 'ready') ? 0.075 : 0;
  const walkBob = Math.abs(Math.sin(walkPhase))*0.025*moveAmp;
  const sway = mode === 'pole' && poseName !== 'ready' ? Math.sin(clock*1.3)*0.012 : 0;
  const k = 1 - Math.exp(-(mode === 'pole' ? 4 : 10)*dt);
  _v.set(pose.p[0], pose.p[1] + lift + walkBob + sway, pose.p[2]);
  char.position.lerp(_v, k);
  char.quaternion.slerp(pose.q, k);

  const sw = Math.sin(walkPhase)*moveAmp;
  const breath = Math.sin(clock*1.6)*0.018;
  JOINTS.forEach(n => {
    if (pose.ikSkip.has(n)) return;
    const b = pose.j[n] || [0,0,0];
    let x = b[0], y = b[1], z = b[2];
    if (moveAmp > 0.001){
      if (n === 'lThigh') x += -0.45*sw;
      if (n === 'rThigh') x +=  0.45*sw;
      if (n === 'lShin')  x += Math.max(0,  Math.sin(walkPhase - 0.9))*0.65*moveAmp;
      if (n === 'rShin')  x += Math.max(0, -Math.sin(walkPhase - 0.9))*0.65*moveAmp;
      if (n === 'lUp')    x +=  0.3*sw;
      if (n === 'rUp')    x += -0.3*sw;
      if (n === 'spine')  y += 0.08*sw;
    }
    if (n === 'chest') x += breath;
    if (outfit.shoes === 'heels' && (n === 'lFoot' || n === 'rFoot') && (poseName === 'stand' || poseName === 'ready')) x += 0.35;
    _q.setFromEuler(_e.set(x, y, z));
    J[n].quaternion.slerp(_q, k);
  });

  // IK grips on the pole
  holder.updateMatrixWorld(true);
  const kIK = 1 - Math.exp(-(mode === 'pole' ? 9 : 14)*dt);
  Object.entries(pose.ik || {}).forEach(([name, spec]) => solveIK(LIMBS[name], spec, kIK));

  // hair and skirts hang with gravity; skirts flare while spinning
  holder.updateMatrixWorld(true);
  hang(skirtPivot, char, 0.82, dt, 7);
  hang(tailPivot, head, 0.85, dt, 9);
  hang(longPivot, head, 0.7, dt, 9);
  const flare = Math.min(1, Math.abs(spinVel)/2.5);
  skirtShort.scale.set(1 + 0.3*flare, 1, 0.85 + 0.3*flare);
  skirtLong.scale.set(1 + 0.4*flare, 1 - 0.1*flare, 0.85 + 0.4*flare);

  updateCamera(dt);
}
function hang(pivot, parent, amount, dt, rate){
  parent.getWorldQuaternion(_q2); _q2.invert();
  _v.set(0, -1, 0).applyQuaternion(_q2).normalize();
  _q3.setFromUnitVectors(DOWN, _v);
  _q2.identity().slerp(_q3, amount);
  pivot.quaternion.slerp(_q2, 1 - Math.exp(-rate*dt));
}

/* ---------- input ---------- */
const pointers = new Map();
let down = null, pinch0 = 0, dist0 = 0;
const pdist = () => { const [a, b] = [...pointers.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 1) down = { x:e.clientX, y:e.clientY, moved:false };
  if (pointers.size === 2){ pinch0 = pdist(); dist0 = camDist; if (down) down.moved = true; }
});
canvas.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId); if (!prev) return;
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  prev.x = e.clientX; prev.y = e.clientY;
  if (pointers.size === 1 && down){
    if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) down.moved = true;
    if (down.moved){ yaw -= dx*0.006; pitch = Math.min(1.25, Math.max(-0.2, pitch + dy*0.004)); poseYaw -= dx*0.006; }
  } else if (pointers.size === 2){
    camDist = Math.min(14, Math.max(1.4, dist0*pinch0/Math.max(1, pdist())));
  }
});
function endPointer(e){
  if (pointers.size === 1 && down && !down.moved && e.type === 'pointerup') clickGround(e);
  pointers.delete(e.pointerId);
  if (!pointers.size) down = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); camDist = Math.min(14, Math.max(1.4, camDist*(1 + Math.sign(e.deltaY)*0.1))); }, { passive:false });

const ray = new T.Raycaster(), groundPlane = new T.Plane(new V3(0, 1, 0), 0);
function clickGround(e){
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera({ x:((e.clientX - r.left)/r.width)*2 - 1, y:-((e.clientY - r.top)/r.height)*2 + 1 }, camera);
  const hit = new V3();
  if (!ray.ray.intersectPlane(groundPlane, hit)) return;
  if (Math.hypot(hit.x - POLE.x, hit.z - POLE.z) < 0.6) return;
  if (!walkable(hit.x, hit.z)) return;
  marker.position.set(hit.x, 0.03, hit.z); marker.material.opacity = 0.9; marker.scale.setScalar(1);
  goTo(hit);
}
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  const m = MOVE_ORDER.find(n => POSES[n].key === e.key);
  if (m) startMove(m);
  if (k === 'escape' || k === 'q') requestLeave(null);
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => Object.keys(keys).forEach(k => keys[k] = false));

/* ---------- UI ---------- */
const movesEl = document.getElementById('moves');
MOVE_ORDER.forEach(n => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'move'; b.dataset.move = n; b.id = 'mv-' + n;
  b.innerHTML = `<span>${POSES[n].label}</span><small>${POSES[n].key} · ${POSES[n].sub}</small>`;
  b.addEventListener('click', () => startMove(n));
  movesEl.appendChild(b);
});
const leaveBtn = document.createElement('button');
leaveBtn.type = 'button'; leaveBtn.className = 'move leave'; leaveBtn.id = 'mv-leave';
leaveBtn.innerHTML = '<span>내려오기</span><small>Q · 폴에서 떨어지기</small>';
leaveBtn.addEventListener('click', () => requestLeave(null));
movesEl.appendChild(leaveBtn);

const statusText = document.getElementById('statusText');
function updateUI(){
  const active = mode === 'approach' ? queuedMove : (mode === 'pole' ? poseName : null);
  movesEl.querySelectorAll('.move[data-move]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.move === active)));
  statusText.textContent = mode === 'approach' ? '폴로 이동 중' : (mode === 'pole' ? (pendingLeave ? '내려오는 중' : POSES[poseName].label) : '자유 이동');
  leaveBtn.disabled = mode !== 'pole';
}
const spinTog = document.getElementById('spinTog');
spinTog.addEventListener('click', () => { spinPole = !spinPole; spinTog.setAttribute('aria-pressed', String(spinPole)); if (!spinPole) poseYaw = yaw + 0; });
const camTog = document.getElementById('camTog');
camTog.addEventListener('click', () => { wide = !wide; camTog.setAttribute('aria-pressed', String(wide)); camTog.textContent = wide ? '캐릭터 보기' : '전체 보기'; });

const wardrobe = document.getElementById('wardrobe');
const wBtn = document.getElementById('wardrobeBtn');
function setWardrobe(open){ wardrobe.hidden = !open; wBtn.hidden = open; wBtn.setAttribute('aria-expanded', String(open)); }
wBtn.addEventListener('click', () => setWardrobe(true));
document.getElementById('wardrobeClose').addEventListener('click', () => setWardrobe(false));
setWardrobe(window.innerWidth > 720);

document.querySelectorAll('.chips').forEach(el => {
  const key = el.dataset.key;
  OPTIONS[key].forEach(([v, label]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = label; b.dataset.v = v; b.id = `opt-${key}-${v}`;
    b.addEventListener('click', () => { outfit[key] = v; applyOutfit(); });
    el.appendChild(b);
  });
});
document.querySelectorAll('.sw').forEach(el => {
  const key = el.dataset.key;
  COLORS[key].forEach(([v, label]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'swatch'; b.style.background = v; b.dataset.v = v; b.title = label; b.id = `sw-${key}-${v.slice(1)}`;
    b.setAttribute('aria-label', label);
    b.addEventListener('click', () => { outfit[key] = v; applyOutfit(); });
    el.appendChild(b);
  });
});
function syncWardrobe(){
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === outfit[key])));
  });
}

/* ---------- loop ---------- */
function resize(){
  const w = host.clientWidth || window.innerWidth, h = host.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.fov = w < 640 ? 55 : 45;
  if (w < 640 && camDist === 5.2) camDist = 6.2;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
applyOutfit();
updateUI();

let last = performance.now();
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused = false;
function frame(now){
  if (paused){ last = now; requestAnimationFrame(frame); return; }
  const dt = Math.min(0.05, Math.max(0, (now - last)/1000)); last = Math.max(last, now);
  update(reduced ? dt*0.6 : dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
for (let i = 0; i < 30; i++) update(1/30);
requestAnimationFrame(frame);

// test hook: jump straight into a pose (used for previews)
window.__poleDebug = {
  pose(name, y, p, d){ queuedMove = name; holder.position.set(0, 0, 0.34); mode = 'approach'; enterPole(); if (y != null){ yaw = y; poseYaw = y; } if (p != null) pitch = p; if (d != null) camDist = d; for (let i = 0; i < 240; i++) update(1/60); renderer.render(scene, camera); },
  pause(v){ paused = v; },
  face(d){ holder.updateMatrixWorld(true); const h = new V3(); J.head.getWorldPosition(h); h.y += 0.09; const f = new V3(0,0,1).applyQuaternion(J.head.getWorldQuaternion(new Q())); camera.position.copy(h).addScaledVector(f, d || 0.5); camera.lookAt(h); renderer.render(scene, camera); },
  state(){ holder.updateMatrixWorld(true); const c = new V3(); char.getWorldPosition(c); return { cam: camera.position.toArray(), tgt: camTarget.toArray(), holder: holder.position.toArray(), char: c.toArray(), q: char.quaternion.toArray(), mode, poseName }; },
  look(y, p, d){ yaw = y; pitch = p; camDist = d; for (let i = 0; i < 60; i++) update(1/60); renderer.render(scene, camera); }
};
})();
</script>
