# 폴크닉 실시간 서버: Worker(입구) + Durable Object(방 하나 = Room 하나)
name = "polknic-server"
main = "src/index.js"
compatibility_date = "2026-10-01"
# 커스텀 도메인 (docs/DECISIONS.md: API 주소는 한 단계 서브도메인). DNS 레코드는 배포 때 Cloudflare가 만든다.
# [[...]] 표 아래에 두면 그 표의 값이 되어 무시되니 맨 위에 둘 것
routes = [{ pattern = "polknic-ws.yujamong.com", custom_domain = true }]

# 매일 23:59 한국 시간(= 14:59 UTC) 오늘 입장 수를 슬랙으로 (index.js scheduled)
[triggers]
crons = ["59 14 * * *"]

[vars]
ROOM_CAP = "20"     # 방 정원 (docs/MULTIPLAYER.md)
MAX_ROOMS = "5"     # 방 개수 상한. 넘으면 클라이언트는 혼자 모드로

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 무료 플랜은 SQLite 기반 Durable Object만 쓸 수 있다
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 알림판 저장소(방명록·기술 요청·문의, board.js). 처음 배포 전 docs/BOARD.md "배포"대로 만들고 database_id를 채울 것
[[d1_databases]]
binding = "DB"
database_name = "polknic-board"
database_id = "REPLACE_WITH_D1_ID"

# 방문 집계(방 5개를 통틀어 한 곳, index.js Stats)
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]
